name: Pinned Bun
description: >-
  Bun at the version commons pins (commons/generated/pins.auto.env, commons 0005-typescript-runtime FR-026), fetched with retries, kept only where its SHA-256 is
  the pinned one, unpacked by IFC TypeScript's own zip reader (commons/ts/tools/install-bun.ts, run by Node) and put on the PATH. Linux, macOS and Windows; no
  shell script, no Python, no unzip.
inputs:
  node-version:
    description: The Node that runs the installer.
    default: "26.13.1"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Bun, pinned and checked
      shell: bash
      run: node commons/ts/tools/install-bun.ts "$RUNNER_TEMP/bun"
