name: tests

# The machine setup runs on a computer with nothing on it, so its tests run on every change, with no root, no apt and no network but the Deno and the
# test library they fetch. Deno comes through the repository's own bootstraps (they are what is tested first); commons' tools are TypeScript too, so Deno is all.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck git dash unzip
      - name: Deno, through bin/erga-bootstrap.sh itself
        run: |
          sh bin/erga-bootstrap.sh --help
          v=$(sed -n 's/^DENO_VERSION=//p' commons/generated/pins.auto.env)
          echo "$HOME/.local/share/erga/toolchain/deno/$v/linux-x64" >>"$GITHUB_PATH"
      - name: Type check, lint and format
        run: deno check bin/setup/main.ts commons/tools/*.ts tests/*.ts && deno lint && deno fmt --check
      - name: The tests of the setup and of commons
        run: deno test -A
      - name: Commons' generated files and specifications, as a person checks them
        run: |
          deno run --allow-read --allow-write commons/tools/generate-packaging.ts --check
          deno run --no-config --allow-read commons/tools/spec-kit-check.ts
      - name: shellcheck
        run: shellcheck -s sh -S warning bin/erga-bootstrap.sh bin/erga-setup.sh

  # The same inside an Arch Linux container (erga's 009-machine-bootstrap FR-014 to FR-016): the setup on a computer whose package manager is pacman.
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Tools the tests use
        run: pacman -Syu --noconfirm git shellcheck curl diffutils unzip
      - uses: actions/checkout@v4
      - name: Let git read the checkout (the container's user is not its owner)
        run: git config --global --add safe.directory '*'
      - name: Deno, through bin/erga-bootstrap.sh itself
        run: |
          sh bin/erga-bootstrap.sh --help
          v=$(sed -n 's/^DENO_VERSION=//p' commons/generated/pins.auto.env)
          echo "$HOME/.local/share/erga/toolchain/deno/$v/linux-x64" >>"$GITHUB_PATH"
      - name: The tests of the setup and of commons
        run: deno test -A

  # commons/ts (commons 0005-sql-aide): SQL Aide and the libraries that accept it, checked by the TypeScript 7 compiler and tested under Bun and under Node, on SQLite,
  # DuckDB, PGlite and a PostgreSQL server that exists only for this run (the runner's own, with pgTAP; its password is the runner's and guards nothing).
  sql-aide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commons/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: A PostgreSQL for the run, with pgTAP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres psql -qc "alter user postgres password 'postgres'"
          echo "IFCSQL_PG_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres" >>"$GITHUB_ENV"
      - name: What checking and testing install
        run: bun install --frozen-lockfile
      - name: The TypeScript 7 compiler, then every test under Bun
        run: bun run check
      - name: The same tests under Node
        run: bun run test:node

  # Windows: bin/erga-bootstrap.ps1 gets the Windows Deno into erga's store and hands over; the Windows side (WSL, the user, PostgreSQL read only) is tested with
  # stand-ins for wsl.exe and the registry, and its dry run runs for real.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deno, through bin/erga-bootstrap.ps1 itself
        shell: pwsh
        run: ./bin/erga-bootstrap.ps1 --help
      - name: The dry run of the Windows side
        shell: pwsh
        run: ./bin/erga-bootstrap.ps1 --dry-run
      - name: The old Windows line still runs it
        shell: pwsh
        run: ./bin/erga-windows.ps1 --help
      - name: The Windows side's tests
        shell: pwsh
        run: |
          $v = ((Select-String -Path commons/generated/pins.auto.env -Pattern '^DENO_VERSION=').Line -split '=')[1]
          & "$env:LOCALAPPDATA\erga\toolchain\deno\$v\windows-x64\deno.exe" test -A tests/windows_test.ts
          exit $LASTEXITCODE
