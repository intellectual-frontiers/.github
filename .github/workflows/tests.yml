name: tests

# The machine setup script is POSIX sh that runs on a computer with nothing on it, so its tests run on every change: standard library only, no network, no root.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5   # runs commons' generator, whose tests are skipped without it
      - name: Tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq git
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v

  # The same tests inside an Arch Linux container (0136-machine-bootstrap FR-052 to FR-056): the setup's own checks on a computer whose package manager is pacman.
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Tools the tests use
        run: pacman -Syu --noconfirm python git shellcheck jq curl diffutils unzip
      - uses: actions/checkout@v4
      - name: Let git read the checkout (the container's user is not its owner)
        run: git config --global --add safe.directory '*'
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
