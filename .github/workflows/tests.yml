name: tests

# The tests of the repository's own files (`tests/`: the one-command installers of agora, commons' packaging tools and specification checker, the layout of the repository),
# on IFC TypeScript: Bun, the default runtime, and Node 26, the backup. Bun comes at the version commons pins (the `.github/actions/bun` action), Node 26 from
# `actions/setup-node`. The tests run the real programs (real `sh`, real `git`, the real tools), never stand-ins; GitHub CLI's sign-in needs an account and a browser,
# and is not run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"
  # Bun's linter is not in a release yet (1.4.4); this exact canary runs it until one is, then the pin in commons' pins does (commons 0005-typescript-runtime FR-028).
  BUN_LINT_VERSION: "1.4.4-canary.20261115.1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: The development tools, from bun.lock
        working-directory: commons/ts
        run: bun install --frozen-lockfile
      - name: TypeScript 7 on commons' tools and on these tests
        working-directory: commons/ts
        run: bun run check
      - name: The formatter
        working-directory: commons/ts
        run: bun fmt --check . ../tools ../../tests
      - name: The linter, type-aware, no warning allowed
        working-directory: commons/ts
        run: bun x "bun@$BUN_LINT_VERSION" lint --type-aware --max-warnings 0 ../tools ../../tests mizan ../ontology/mizan
      - name: Commons' generated files and specifications, as a person checks them, on Bun and on Node 26
        run: |
          bun commons/tools/generate-packaging.ts --check
          bun commons/tools/mizan-check.ts
          bun commons/ts/mizan/generate-ontology.ts --check
          bun commons/ts/mizan/check.ts
          bun commons/ts/mizan/integrations/host/import.ts commons/ts/mizan/imports/schema-org.import.ts --check --fetch
          node commons/tools/generate-packaging.ts --check
          node commons/tools/mizan-check.ts
          node commons/ts/mizan/generate-ontology.ts --check
          node commons/ts/mizan/check.ts
          node commons/ts/mizan/integrations/host/import.ts commons/ts/mizan/imports/schema-org.import.ts --check --fetch

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [bun, node]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: The development tools, from bun.lock
        working-directory: commons/ts
        run: bun install --frozen-lockfile
      - name: ShellCheck, which the packaging test uses where it is installed
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Independent validators of the exports (rdflib, pySHACL, jsonschema), which the Mizan test uses where they are installed
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q rdflib==7.6.0 pyshacl==0.40.2 jsonschema==4.26.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The tests on Bun
        if: matrix.runtime == 'bun'
        run: bun test ./tests/
      - name: The tests on Node 26
        if: matrix.runtime == 'node'
        run: node --test "tests/*.test.ts"

  # Windows: what has no shell in it. The generator and the specification checker run on both runtimes; the installers' tests need a POSIX `sh` and a Unix PATH, and
  # `agora-install.ps1` is read by its test on the other systems and is not run by any test (it needs a sign-in to GitHub).
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: Commons' generated files and specifications, on Bun and on Node 26
        shell: bash
        run: |
          bun commons/tools/generate-packaging.ts --check
          bun commons/tools/mizan-check.ts
          bun commons/ts/mizan/generate-ontology.ts --check
          bun commons/ts/mizan/check.ts
          node commons/tools/generate-packaging.ts --check
          node commons/tools/mizan-check.ts
          node commons/ts/mizan/generate-ontology.ts --check
          node commons/ts/mizan/check.ts
