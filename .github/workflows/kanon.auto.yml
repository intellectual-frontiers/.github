# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: kanon

# Kanon, the pattern of a library built in three layers (commons 0033-kanon): its own `verify` (the compiler, the specification checker, the trace check, its tests and the
# packing of its package with the inspection of its declarations) on Bun and its tests on Node 26, on Windows, macOS and Linux, because the package runs on all three.
on:
  push:
    paths:
      - ".github/actions/**"
      - .github/workflows/kanon.auto.yml
      - "commons/core/src/**"
      - "commons/formats/src/**"
      - "commons/kanon/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/system/src/**"
      - "commons/test/src/**"
      - "commons/tools/**"
      - "commons/ts/kernel/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - .github/workflows/kanon.auto.yml
      - "commons/core/src/**"
      - "commons/formats/src/**"
      - "commons/kanon/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/system/src/**"
      - "commons/test/src/**"
      - "commons/tools/**"
      - "commons/ts/kernel/**"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the kernel is linked from commons/ts)"
        run: bun install --frozen-lockfile
        working-directory: commons/kanon
      - name: verify
        run: bun run verify
        working-directory: commons/kanon

  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: commons/kanon
      - name: The tests on Node 26
        run: "node --test \"suite/**/*.test.ts\""
        working-directory: commons/kanon
