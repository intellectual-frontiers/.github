    paths:
      - ".github/actions/**"
      - .github/workflows/integrations-fhir.auto.yml
      - "commons/core/src/**"
      - "commons/integrations-fhir/**"
      - "commons/integrations/src/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/system/src/**"
