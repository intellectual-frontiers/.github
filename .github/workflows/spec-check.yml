# Checks this repository's specs and enforcement register on every push and
# pull request (0020-spec-format FR-015), on a stock runner given only uv (0025-tooling-environment FR-011). The spec suite needs no package
# and no program the runner lacks (0042-agora FR-014, FR-022).
name: spec-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Specs, enforcement register, controls, ontology and commands
        run: ./agora check --suite spec
