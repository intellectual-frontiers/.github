# Checks this repository's specs and enforcement register on every push and
# pull request (0020-spec-format FR-015). A stock runner with Python and uv
# set up; the spec suite needs no package and no other program (0042-agora FR-014, FR-022).
name: spec-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Specs, enforcement register, controls, ontology, environment and commands
        run: ./agora check --suite spec
