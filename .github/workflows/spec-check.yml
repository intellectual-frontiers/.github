# Checks this repository's specs and enforcement register on every push and
# pull request (0020-spec-format FR-015). Two stock runners (0025-tooling-environment FR-011): one with only uv, where the toolchain section
# that compares files only ws-host can generate is skipped and `--available` accepts that, and one with ws-host bootstrapped, where nothing is
# skipped. The spec suite needs no package and no other program (0042-agora FR-014, FR-022).
name: spec-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Bootstrap ws-host and enable the clone (0025 FR-033)
        run: |
          curl -fsSL https://raw.githubusercontent.com/intellectual-frontiers/workspaces-host/main/install.sh | WS_HOST_NO_APT=1 WS_HOST_NO_ADVANCE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ws-host" provider add "$PWD" --yes
      - name: Specs, enforcement register, controls, ontology and commands
        run: ./agora check --suite spec

  spec-check-bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Specs, enforcement register, controls, ontology and commands, with uv alone
        run: ./agora check --suite spec --available
