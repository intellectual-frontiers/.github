# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: release

# The release of the libraries (commons 0001-libraries FR-014, FR-015): by hand, from main, after `bun run release apply` (commons/libraries/src/releasing.ts) has written the versions and the record `commons/generated/release.auto.json` and they are pushed.
# `plan` reads the record and leaves out what is tagged; `build` proves and packs each library (`verify`, `tools/pack.ts`); `publish`, where asked, sends the tarballs in dependency order to npm with provenance, by npm's trusted
# publishing (the owner sets a trusted publisher once for each package on npmjs.com: this repository, this workflow's file, the environment `npm`) or, where the repository has the secret INFRO_NPMJS_TOKEN, by that token,
# and to the GitHub package registry, and makes the tag of each. A version that is on a registry is skipped and a tag that is there is kept, so a run again continues where one stopped.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and tag; without it the run only plans, proves and packs"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-build: ${{ steps.plan.outputs.has-build }}
      build: ${{ steps.plan.outputs.build }}
      sequence: ${{ steps.plan.outputs.sequence }}
    steps:
      # the whole history and its tags: the plan leaves out what is tagged
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "The libraries to release, in dependency order, from the record"
        id: plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "a release is made from main, not $GITHUB_REF"; exit 1; }
          bun commons/libraries/src/releasing.ts matrix --github-output "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.slug }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan]
    if: "needs.plan.outputs.has-build == 'true'"
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
      - name: "verify, which includes the packing"
        run: bun run verify
        working-directory: ${{ matrix.folder }}
      - name: The package that is published
        run: bun tools/pack.ts
        working-directory: ${{ matrix.folder }}
      - name: "The tarball, kept for the job that publishes it"
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.slug }}
          path: ${{ matrix.folder }}/dist/*.tgz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build]
    if: "inputs.publish && needs.plan.outputs.has-build == 'true'"
    permissions:
      contents: write
      id-token: write
      packages: write
    environment:
      name: npm
    steps:
      # the tags: what is tagged is left out
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the command reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported"
        run: bun commons/libraries/src/link.ts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: The tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: "package-*"
          path: package
      - name: "Published in dependency order to npm and to the GitHub package registry, and tagged: each release by itself, a version already on npm is only tagged"
        shell: bash
        run: bun commons/libraries/src/releasing.ts publish --dir package
        env:
          NPM_TOKEN: ${{ secrets.INFRO_NPMJS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
