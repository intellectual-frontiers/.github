# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: release

# The release of the libraries (commons 0001-libraries FR-014, FR-015): by hand, from main, after `bun run release apply` (commons/libraries/src/releasing.ts) has written the versions and the record `commons/generated/release.auto.json` and they are pushed.
# `plan` reads the record and leaves out what is tagged; `build` proves and packs each library (`verify`, `tools/pack.ts`); `publish`, where asked, sends the tarballs in dependency order to npm with provenance, by npm's trusted
# publishing (the owner sets a trusted publisher once for each package on npmjs.com: this repository, this workflow's file, the environment `npm`) or, where the repository has the secret INFRO_NPMJS_TOKEN, by that token,
# and to the GitHub package registry, and makes the tag of each; the registries of an entry are those its record names (in `single` distribution the one package goes to the GitHub package registry alone, 0036-distribution FR-028).
# A version that is on a registry is skipped and a tag that is there is kept, so a run again continues where one stopped.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and tag; without it the run only plans, proves and packs"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-build: ${{ steps.plan.outputs.has-build }}
      build: ${{ steps.plan.outputs.build }}
      sequence: ${{ steps.plan.outputs.sequence }}
    steps:
      # the whole history and its tags: the plan leaves out what is tagged
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "The libraries to release, in dependency order, from the record"
        id: plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "a release is made from main, not $GITHUB_REF"; exit 1; }
          bun commons/libraries/src/releasing.ts matrix --github-output "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.slug }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan]
    if: "needs.plan.outputs.has-build == 'true'"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock"
        id: the-development-tools-from-bun-lock-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-development-tools-from-bun-lock-3 --job "build" --module "${{ matrix.slug }}" --tool install --timeout 6 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "verify, which includes the packing"
        id: verify-which-includes-the-packing-4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id verify-which-includes-the-packing-4 --job "build" --module "${{ matrix.slug }}" --tool verify --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun run verify
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: The package that is published
        id: the-package-that-is-published-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-package-that-is-published-5 --job "build" --module "${{ matrix.slug }}" --tool exit-status --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun tools/pack.ts
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "The tarball, kept for the job that publishes it"
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.slug }}
          path: ${{ matrix.folder }}/dist/*.tgz
          if-no-files-found: error
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-release-build-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build]
    if: "always() && inputs.publish && needs.plan.outputs.has-build == 'true' && needs.plan.result == 'success'"
    permissions:
      contents: write
      id-token: write
      packages: write
    environment:
      name: npm
    steps:
      # the tags: what is tagged is left out
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The packages the command reads, from the root's bun.lock"
        id: the-packages-the-command-reads-from-the--3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-packages-the-command-reads-from-the--3 --job "publish" --module "repository" --tool install --timeout 18 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        continue-on-error: true
      - name: "The libraries, linked by name before any of them is imported"
        id: the-libraries-linked-by-name-before-any--4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-libraries-linked-by-name-before-any--4 --job "publish" --module "repository" --tool exit-status --timeout 48 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun commons/libraries/src/link.ts
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
        continue-on-error: true
      - name: The tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: "package-*"
          path: package
        continue-on-error: true
      - name: "The release policy of the day, and the findings that are open (commons 0038-build-policy FR-010)"
        shell: bash
        run: bun commons/libraries/src/ci/release-gate.ts --history refs/remotes/origin/findings-history
      - name: "Published in dependency order to npm and to the GitHub package registry, and tagged: each release by itself, a version already on npm is only tagged"
        shell: bash
        run: bun commons/libraries/src/releasing.ts publish --dir package
        env:
          NPM_TOKEN: ${{ secrets.INFRO_NPMJS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-release-publish-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this workflow, gathered: it passes if and only if the pipeline is sound (0038-build-policy FR-005); a failing test, a type error or a crashed command in any cell is a finding here and never a red job
  findings:
    name: findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan, build, publish]
    if: "always()"
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/bun
      - name: The findings every job kept
        uses: actions/download-artifact@v4
        with:
          pattern: "findings-release-*"
          path: _findings
          merge-multiple: true
        continue-on-error: true
      - name: "The findings, merged; the pipeline is sound where every cell that ran left its file (ci/collect.ts)"
        shell: bash
        run: |
          set -u
          empty='{}'
          if [ "$PLAN_RESULT" != "success" ]; then echo "the plan could not be made (the red cause plan-unavailable)"; exit 2; fi
          bun commons/libraries/src/ci/collect.ts --dir _findings --out _findings-out --workflow release  --check-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: release
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_LINUX: ${{ needs.plan.outputs.linux }}
      - name: "The merged findings, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-release
          path: _findings-out
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this run added to the history branch (0038-build-policy FR-012): main only, the one job with the permission to write the repository's contents, never a red run
  keep-findings:
    name: keep-findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [findings]
    if: "always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: The merged findings of this workflow
        uses: actions/download-artifact@v4
        with:
          name: findings-release
          path: _findings-merged
        continue-on-error: true
      - name: "The findings added to the history branch (the only writer)"
        shell: bash
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bun commons/libraries/src/ci/history.ts --file _findings-merged/findings.json --remote "https://github.com/$GITHUB_REPOSITORY.git"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
