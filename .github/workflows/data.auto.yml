# Generated by bun commons/ts/tools/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: data

# IFC data, an independent library of commons (commons 0027-commons-libraries FR-010): its own `verify` (the compiler, the specification checker and the rules on its own
# spec kit, and its tests) on Bun, and its tests on Node 26, the backup runtime (commons 0005-typescript-runtime). It runs when its folder changes or what it imports does:
# the kernel and the runtime, the specification tools, and the Bun action.
on:
  push:
    paths:
      - ".github/actions/**"
      - .github/workflows/data.auto.yml
      - "commons/core/src/**"
      - "commons/crypto/src/**"
      - "commons/data/**"
      - "commons/formats/src/**"
      - "commons/ontology/audit/**"
      - "commons/ontology/ifccm/**"
      - "commons/ontology/ifqs/**"
      - "commons/ontology/ifr/**"
      - "commons/ontology/mizan/**"
      - "commons/ontology/supply-chain/**"
      - "commons/rdf/src/**"
      - "commons/tools/**"
      - "commons/ts/githost/**"
      - "commons/ts/kernel/**"
      - "commons/ts/mizan/**"
      - "commons/ts/runtime/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - .github/workflows/data.auto.yml
      - "commons/core/src/**"
      - "commons/crypto/src/**"
      - "commons/data/**"
      - "commons/formats/src/**"
      - "commons/ontology/audit/**"
      - "commons/ontology/ifccm/**"
      - "commons/ontology/ifqs/**"
      - "commons/ontology/ifr/**"
      - "commons/ontology/mizan/**"
      - "commons/ontology/supply-chain/**"
      - "commons/rdf/src/**"
      - "commons/tools/**"
      - "commons/ts/githost/**"
      - "commons/ts/kernel/**"
      - "commons/ts/mizan/**"
      - "commons/ts/runtime/**"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the kernel is linked from commons/ts)"
        run: bun install --frozen-lockfile
        working-directory: commons/data
      - name: verify
        run: bun run verify
        working-directory: commons/data
      - name: "The terms of DPV, as the vocabulary's CSV makes them (a fetch, so not in verify)"
        run: bun tools/generate-dpv.ts --check
        working-directory: commons/data

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: commons/data
      - name: The tests on Node 26
        run: "node --test \"suite/**/*.test.ts\""
        working-directory: commons/data
