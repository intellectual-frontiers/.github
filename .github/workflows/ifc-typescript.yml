name: ifc-typescript

# IFC TypeScript (commons 0005-typescript-runtime FR-017, FR-018, FR-026 to FR-030). TypeScript 7 checks; Bun, pinned in commons' pins, installs, formats, lints
# and packs; the same tests run unchanged on Deno, Node 26 and Bun, on Linux, macOS and Windows; and the packed tarball is installed and used on the three runtimes.
on:
  push:
    paths:
      - "commons/ts/**"
      - "commons/generated/pins.auto.env"
      - ".github/actions/bun/**"
      - ".github/workflows/ifc-typescript*.yml"
  pull_request:
    paths:
      - "commons/ts/**"
      - "commons/generated/pins.auto.env"
      - ".github/actions/bun/**"
      - ".github/workflows/ifc-typescript*.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"
  # FR-028: Bun's linter is not in a release yet (1.4.4); this exact canary runs it until one is, then the pin in commons' pins does.
  BUN_LINT_VERSION: "1.4.4-canary.20261115.1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: The development tools, from bun.lock
        working-directory: commons/ts
        run: bun install --frozen-lockfile
      - name: TypeScript 7 on everything, then the kernel with no host types
        working-directory: commons/ts
        run: bun x tsc --version && bun run check
      - name: The formatter
        working-directory: commons/ts
        run: bun fmt --check
      - name: The linter, type-aware, no warning allowed
        working-directory: commons/ts
        run: bun x "bun@$BUN_LINT_VERSION" lint --type-aware --max-warnings 0 kernel runtime tests tools

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [deno, node, bun]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: The development tools, from bun.lock
        working-directory: commons/ts
        run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deno, through bin/erga-bootstrap.sh itself
        if: matrix.runtime == 'deno' && runner.os != 'Windows'
        shell: bash
        run: |
          sh bin/erga-bootstrap.sh --help
          v=$(sed -n 's/^DENO_VERSION=//p' commons/generated/pins.auto.env)
          for d in "$HOME"/.local/share/erga/toolchain/deno/"$v"/*/; do echo "$d" >>"$GITHUB_PATH"; done
      - name: Deno, through bin/erga-bootstrap.ps1 itself
        if: matrix.runtime == 'deno' && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bin/erga-bootstrap.ps1 --help
          $v = ((Select-String -Path commons/generated/pins.auto.env -Pattern '^DENO_VERSION=').Line -split '=')[1]
          "$env:LOCALAPPDATA\erga\toolchain\deno\$v\windows-x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The suite on ${{ matrix.runtime }}
        working-directory: commons/ts
        shell: bash
        run: |
          case "${{ matrix.runtime }}" in
            deno) deno --version && deno test -A --no-check tests/ ;;
            node) node --version && node --test "tests/**/*.test.ts" ;;
            bun) bun --version && bun test tests/ ;;
          esac

  otel-conformance:
    # commons 0006-signals FR-020: the suite's OTLP sent to the pinned OpenTelemetry Collector, read back from its file exporter.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: The development tools, from bun.lock
        working-directory: commons/ts
        run: bun install --frozen-lockfile
      - name: The OpenTelemetry Collector, verified against commons' pins
        shell: bash
        run: |
          v=$(sed -n 's/^OTELCOL_CONTRIB_VERSION=//p' commons/generated/pins.auto.env)
          sum=$(sed -n 's/^OTELCOL_CONTRIB_SHA256_X86_64=//p' commons/generated/pins.auto.env)
          dir="$RUNNER_TEMP/otelcol"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/otelcol.tar.gz" "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v$v/otelcol-contrib_${v}_linux_amd64.tar.gz"
          echo "$sum  $dir/otelcol.tar.gz" | sha256sum -c -
          tar -xzf "$dir/otelcol.tar.gz" -C "$dir" otelcol-contrib
          echo "IFC_OTELCOL=$dir/otelcol-contrib" >>"$GITHUB_ENV"
      - name: The conformance test, on Bun and on Node
        working-directory: commons/ts
        run: |
          bun test tests/runtime/otel-conformance.test.ts
          node --test tests/runtime/otel-conformance.test.ts

  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deno, through bin/erga-bootstrap.sh itself
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh bin/erga-bootstrap.sh --help
          v=$(sed -n 's/^DENO_VERSION=//p' commons/generated/pins.auto.env)
          for d in "$HOME"/.local/share/erga/toolchain/deno/"$v"/*/; do echo "$d" >>"$GITHUB_PATH"; done
      - name: Deno, through bin/erga-bootstrap.ps1 itself
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bin/erga-bootstrap.ps1 --help
          $v = ((Select-String -Path commons/generated/pins.auto.env -Pattern '^DENO_VERSION=').Line -split '=')[1]
          "$env:LOCALAPPDATA\erga\toolchain\deno\$v\windows-x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Pack, then install the tarball and use it on Bun, Node and Deno
        working-directory: commons/ts
        shell: bash
        run: |
          bun install --frozen-lockfile
          tarball=$(bun run --silent pack)
          bun run --silent smoke "$tarball"
