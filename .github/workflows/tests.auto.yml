# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: tests

# The tests of the repository's own files (`tests/`: the one-command installers of agora, commons' packaging tools and specification checker, the layout of the repository),
# on IFC TypeScript: Bun, the default runtime, and Node 26, the backup. Bun comes at the version commons pins (the `.github/actions/bun` action), Node 26 from
# `actions/setup-node`. The tests run the real programs (real `sh`, real `git`, the real tools), never stand-ins; GitHub CLI's sign-in needs an account and a browser,
# and is not run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"
  BUN_LINT_VERSION: "1.4.4-canary.20261115.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # the whole history and its tags: `versions check` compares each work with the merge base, and its ledger reads the tags (commons 0026-works-versioning FR-022, FR-035)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The root's development tools, from bun.lock"
        id: the-root-s-development-tools-from-bun-lo-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-root-s-development-tools-from-bun-lo-3 --job "check" --module "repository" --tool install --timeout 4 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: .
        continue-on-error: true
      - name: "The documentation generator's dependencies, which the tests of the root import"
        id: the-documentation-generator-s-dependenci-4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-documentation-generator-s-dependenci-4 --job "check" --module "repository" --tool install --timeout 4 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: "TypeScript 7 on the tests of the root and on commons' tools"
        id: typescript-7-on-the-tests-of-the-root-an-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id typescript-7-on-the-tests-of-the-root-an-5 --job "check" --module "repository" --tool tsc --timeout 9 --out "$RUNNER_TEMP/findings" -- bash -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "bun commons/libraries/src/link.ts && bun x tsc -p tests/tsconfig.json && bun x tsc -p commons/tools/tsconfig.json"
        continue-on-error: true
      - name: The formatter
        id: the-formatter-6
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-formatter-6 --job "check" --module "repository" --tool format --timeout 9 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun fmt --check commons/tools tests
        continue-on-error: true
      - name: "The linter, type-aware, no warning allowed"
        id: the-linter-type-aware-no-warning-allowed-7
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-linter-type-aware-no-warning-allowed-7 --job "check" --module "repository" --tool lint --timeout 9 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "bun x \"bun@$BUN_LINT_VERSION\" lint --type-aware --max-warnings 0 commons/tools tests"
        continue-on-error: true
      - name: "Commons' generated files and specifications, as a person checks them, on Bun and on Node 26"
        id: commons-generated-files-and-specificatio-8
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id commons-generated-files-and-specificatio-8 --job "check" --module "repository" --tool checks --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            bun commons/tools/generate-packaging.ts --check
            bun commons/tools/mizan-check.ts
            bun commons/libraries/src/generate-ontology.ts --check
            bun commons/libraries/src/check.ts
            bun commons/libraries/src/libraries.ts --check
            bun commons/libraries/src/versions.ts check
            bun commons/libraries/src/versions.ts ledger
            bun commons/mizan/src/integrations/host/import.ts commons/libraries/src/imports/schema-org.import.ts --check --fetch
            bun commons/mizan/src/integrations/host/import.ts commons/libraries/src/imports/nist-sp-800-53.import.ts --check --fetch
            node commons/tools/generate-packaging.ts --check
            node commons/tools/mizan-check.ts
            node commons/libraries/src/generate-ontology.ts --check
            node commons/libraries/src/check.ts
            node commons/libraries/src/libraries.ts --check
            node commons/libraries/src/versions.ts check
            node commons/libraries/src/versions.ts ledger
            node commons/mizan/src/integrations/host/import.ts commons/libraries/src/imports/schema-org.import.ts --check --fetch
            node commons/mizan/src/integrations/host/import.ts commons/libraries/src/imports/nist-sp-800-53.import.ts --check --fetch
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-tests-check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The root's development tools, from bun.lock"
        id: the-root-s-development-tools-from-bun-lo-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-root-s-development-tools-from-bun-lo-3 --job "tests" --module "repository" --tool install --timeout 4 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: .
        continue-on-error: true
      - name: "ShellCheck, which the packaging test uses where it is installed"
        id: shellcheck-which-the-packaging-test-uses-4
        if: "runner.os == 'Linux'"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id shellcheck-which-the-packaging-test-uses-4 --job "tests" --module "repository" --tool exit-status --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck"
        continue-on-error: true
      - name: "Independent validators of the exports (rdflib, pySHACL, jsonschema), which the Mizan test uses where they are installed"
        id: independent-validators-of-the-exports-rd-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id independent-validators-of-the-exports-rd-5 --job "tests" --module "repository" --tool exit-status --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install -q rdflib==7.6.0 pyshacl==0.40.2 jsonschema==4.26.0 pyyaml==6.0.3
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        continue-on-error: true
      - name: "The tests on Bun, each file by itself so that one that hangs or fails hides no other (tests/release/ is the release's: it packs, installs and type-checks every library)"
        id: the-tests-on-bun-each-file-by-itself-so--6
        if: "matrix.runtime == 'bun'"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-tests-on-bun-each-file-by-itself-so--6 --job "tests" --module "repository" --tool bun-test --timeout 12 --per-file true --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            for f in tests/*.test.ts; do
              echo "$f:"
              timeout 5m bun test "$f" || true
            done
        continue-on-error: true
      - name: The tests on Node 26
        id: the-tests-on-node-26-7
        if: "matrix.runtime == 'node'"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-tests-on-node-26-7 --job "tests" --module "repository" --tool bun-test --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "node --test \"tests/*.test.ts\""
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-tests-tests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the workflow files are what the model makes and what GitHub's schema accepts (0038-build-policy FR-002): a fault of the pipeline's own configuration, the one thing here that ends a run red
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The workflow files are what the model makes, on Bun and on Node 26"
        shell: bash
        run: |
          bun commons/libraries/src/generate-workflows.ts --check
          node commons/libraries/src/generate-workflows.ts --check

  # Windows: what has no shell in it. The generator and the specification checker run on both runtimes; the installers' tests need a POSIX `sh` and a Unix PATH, and
  # `agora-install.ps1` is read by its test on the other systems and is not run by any test (it needs a sign-in to GitHub).
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "Commons' generated files and specifications, on Bun and on Node 26"
        id: commons-generated-files-and-specificatio-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id commons-generated-files-and-specificatio-3 --job "windows" --module "repository" --tool checks --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            bun commons/tools/generate-packaging.ts --check
            bun commons/tools/mizan-check.ts
            bun commons/libraries/src/generate-ontology.ts --check
            bun commons/libraries/src/check.ts
            node commons/tools/generate-packaging.ts --check
            node commons/tools/mizan-check.ts
            node commons/libraries/src/generate-ontology.ts --check
            node commons/libraries/src/check.ts
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-tests-windows-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # ROBOT (the OBO Foundry's ontology tool) reads the generated OWL as a second, independent OWL reader and reports its quality; it must read it, convert it and find it
  # consistent, and its report must have no error. The jar is pinned by version and SHA-256.
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBOT_VERSION: "1.9.11"
      ROBOT_SHA256: "53cd275c8e4c0dad1fc2c1c34174876795cd7d6b6926e1444adcbb0cb3c7ab26"
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - name: "ROBOT, pinned"
        id: robot-pinned-2
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id robot-pinned-2 --job "robot" --module "repository" --tool exit-status --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            curl -fsSL -o "$RUNNER_TEMP/robot.jar" "https://github.com/ontodev/robot/releases/download/v${ROBOT_VERSION}/robot.jar"
            echo "${ROBOT_SHA256}  $RUNNER_TEMP/robot.jar" | sha256sum -c -
        continue-on-error: true
      - name: "Convert, reason and report, for each ontology"
        id: convert-reason-and-report-for-each-ontol-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id convert-reason-and-report-for-each-ontol-3 --job "robot" --module "repository" --tool exit-status --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            for n in mizan ifccm ifqs ifr; do
              java -jar "$RUNNER_TEMP/robot.jar" convert --input "commons/generated/$n.auto.ofn" --format owl --output "$RUNNER_TEMP/$n.owl"
              java -jar "$RUNNER_TEMP/robot.jar" convert --input "commons/generated/$n.auto.ttl" --format ofn --output "$RUNNER_TEMP/$n-from-ttl.ofn"
              java -jar "$RUNNER_TEMP/robot.jar" reason --reasoner ELK --input "commons/generated/$n.auto.ofn"
              java -jar "$RUNNER_TEMP/robot.jar" report --input "commons/generated/$n.auto.ofn" --fail-on ERROR --output "$RUNNER_TEMP/$n-report.tsv"
            done
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-tests-robot-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this workflow, gathered: it passes if and only if the pipeline is sound (0038-build-policy FR-005); a failing test, a type error or a crashed command in any cell is a finding here and never a red job
  findings:
    name: findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [check, tests, workflows, windows, robot]
    if: "always()"
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/bun
      - name: The findings every job kept
        uses: actions/download-artifact@v4
        with:
          pattern: "findings-tests-*"
          path: _findings
          merge-multiple: true
        continue-on-error: true
      - name: "The findings, merged; the pipeline is sound where every cell that ran left its file (ci/collect.ts)"
        shell: bash
        run: |
          set -u
          empty='{}'
          bun commons/libraries/src/ci/collect.ts --dir _findings --out _findings-out --workflow tests  --check-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: tests
      - name: "The merged findings, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-tests
          path: _findings-out
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this run added to the history branch (0038-build-policy FR-012): main only, the one job with the permission to write the repository's contents, never a red run
  keep-findings:
    name: keep-findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [findings]
    if: "always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: The merged findings of this workflow
        uses: actions/download-artifact@v4
        with:
          name: findings-tests
          path: _findings-merged
        continue-on-error: true
      - name: "The findings added to the history branch (the only writer)"
        shell: bash
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bun commons/libraries/src/ci/history.ts --file _findings-merged/findings.json --remote "https://github.com/$GITHUB_REPOSITORY.git"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
