# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: quality

# Quality, the quality system of commons (the record of a run as evidence, the quality branch, the ladder, the ledger, the Trust page and the assessor pack), a library lifted out of `commons/ts`
# (commons 0032-lifting-libraries): its own `verify` on Bun and its tests, which run a real Git, on Node 26, on Linux.
on:
  push:
    paths:
      - ".github/actions/**"
      - .github/workflows/quality.auto.yml
      - "commons/core/src/**"
      - "commons/crypto/src/**"
      - "commons/formats/src/**"
      - "commons/grc/src/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/ontology/src/**"
      - "commons/quality/**"
      - "commons/system/src/**"
      - "commons/telemetry/src/**"
      - "commons/terminal/src/**"
      - "commons/test/src/**"
      - "commons/tools/**"
      - "commons/ts/kernel/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - .github/workflows/quality.auto.yml
      - "commons/core/src/**"
      - "commons/crypto/src/**"
      - "commons/formats/src/**"
      - "commons/grc/src/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/ontology/src/**"
      - "commons/quality/**"
      - "commons/system/src/**"
      - "commons/telemetry/src/**"
      - "commons/terminal/src/**"
      - "commons/test/src/**"
      - "commons/tools/**"
      - "commons/ts/kernel/**"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the kernel is linked from commons/ts)"
        run: bun install --frozen-lockfile
        working-directory: commons/quality
      - name: verify
        run: bun run verify
        working-directory: commons/quality

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: commons/quality
      - name: The tests on Node 26
        run: "node --test \"suite/**/*.test.ts\""
        working-directory: commons/quality
