name: ergonex-publish

# Publishes ergonex (commons 0027-commons-libraries FR-015, FR-016): a tag `ergonex-v<version>` (made by `versions tag`, commons 0026-works-versioning), or a run by hand from main, is checked against the package's version, the library is proved and packed by its own
# tools/pack.ts, and the tarball goes to the registries its manifest names: npm with provenance and no token (trusted publishing, which the owner of the npm scope sets up once for this workflow's file), and
# the GitHub package registry with this workflow's own token.
on:
  push:
    tags:
      - "ergonex-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: commons/ergonex
      - name: "The tag, or main for a run by hand, is the version of the package"
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "ergonex-v$version" || { echo "the tag $GITHUB_REF_NAME is not ergonex-v$version"; exit 1; }
          else
            test "$GITHUB_REF" = refs/heads/main || { echo "a run by hand publishes only from main, not $GITHUB_REF"; exit 1; }
          fi
        working-directory: commons/ergonex
      - name: verify
        run: bun run verify
        working-directory: commons/ergonex
      - name: The package that is published
        run: bun tools/pack.ts
        working-directory: commons/ergonex
      - name: "The tarball, kept for the jobs that publish it"
        uses: actions/upload-artifact@v4
        with:
          name: ergonex-package
          path: "commons/ergonex/dist/*.tgz"
          if-no-files-found: error

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - name: The tarball
        uses: actions/download-artifact@v4
        with:
          name: ergonex-package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: "Published to npm, with provenance and no token"
        shell: bash
        run: "npm publish \"$(ls ./*.tgz)\" --access public --provenance"
        working-directory: package

  publish-github:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: The tarball
        uses: actions/download-artifact@v4
        with:
          name: ergonex-package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@intellectual-frontiers"
      - name: Published to the GitHub package registry
        shell: bash
        run: "npm publish \"$(ls ./*.tgz)\""
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: package
