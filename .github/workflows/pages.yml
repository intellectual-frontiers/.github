# Builds the guide and publishes it to GitHub Pages on every push to main (0042-agora FR-035).
#
# The guide is built by `./agora docs build` on a stock runner given only Python and uv: agora fetches the converters (Java and
# AsciidoctorJ, pinned and verified) into its cache itself (0042-agora FR-030). The three actions that publish the result are GitHub's
# own and install nothing (0042-agora FR-022).
#
# One setting only the repository's owner can change: Settings > Pages > Source must be "GitHub Actions". Until it is, the deploy job
# fails, and says so. The site is served at https://intellectual-frontiers.github.io/.github/
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agora
          key: agora-toolchain-${{ runner.os }}-${{ hashFiles('tools/agora/toolchain/**', 'tools/agora/core/toolchain.py') }}
      - name: The reference chapters are current
        run: ./agora fresh reference-docs
      - name: Build the guide
        run: ./agora docs build --out build/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
