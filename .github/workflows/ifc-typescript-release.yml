name: ifc-typescript-release

# A release of IFC TypeScript (commons 0005-typescript-runtime FR-029, FR-030): a tag ifc-ts-vX.Y.Z whose version is commons/ts/package.json's is built with
# TypeScript 7, packed by the pinned Bun, installed and used on Bun, Node and Deno, and only then attached, with its SHA-256, to the GitHub release of that tag.
# A harness depends on the asset's URL, so its own lockfile keeps the tarball's integrity. It runs on the tag's push, or by hand from main with the tag to make:
# then the tag is made by the release itself, at the commit that was checked, and only once everything has passed.
on:
  push:
    tags:
      - "ifc-ts-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, ifc-ts-vX.Y.Z (X.Y.Z is commons/ts/package.json's version)"
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: By hand, only from main and only for an ifc-ts-v tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "a release is made from main, not $GITHUB_REF" >&2; exit 1; }
          case "$TAG" in ifc-ts-v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "$TAG is not ifc-ts-vX.Y.Z" >&2; exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deno, through bin/erga-bootstrap.sh itself
        run: |
          sh bin/erga-bootstrap.sh --help
          v=$(sed -n 's/^DENO_VERSION=//p' commons/generated/pins.auto.env)
          echo "$HOME/.local/share/erga/toolchain/deno/$v/linux-x64" >>"$GITHUB_PATH"
      - name: Checked, tested, packed for this tag, and used on the three runtimes
        working-directory: commons/ts
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test tests/
          tarball=$(bun run --silent pack --tag "$TAG")
          bun run --silent smoke "$tarball"
          echo "TARBALL=commons/ts/${tarball#"$PWD/"}" >>"$GITHUB_ENV"
      - name: The release, refused where it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; a version is released once" >&2
            exit 1
          fi
          gh release create "$TAG" "$TARBALL" "$TARBALL.sha256" --target "$GITHUB_SHA" \
            --title "IFC TypeScript ${TAG#ifc-ts-v}" \
            --notes "IFC TypeScript (commons 0005-typescript-runtime, 0006-signals, 0007-grc, 0008-test-evidence), built with TypeScript 7 and checked on Bun, Node and Deno. SHA-256: $(cut -d' ' -f1 "$TARBALL.sha256")"
