# Runs this repository's tools inside the reference environment, in the image .devcontainer/devcontainer.json names at
# the commit tools/reference-environment pins (0025-tooling-environment FR-010). Nothing is installed: a failure here
# is a tool or the environment falling short of FR-006. spec-check.yml and design-systems.yml stay as the runs outside
# it, on stock runners given only each tool's prerequisites (FR-011).
name: reference-environment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The press image is large; the stock runner's preinstalled SDKs are not needed here.
      - name: Disk for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: The devcontainer's image
        id: image
        run: |
          image=$(grep -oP '"image"\s*:\s*"\K[^"]+' .devcontainer/devcontainer.json)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker pull -q "$image"
      # A login shell, as a devcontainer opens one, so the environment's session variables are set (0025 FR-006).
      - name: Specs, enforcement register and ontology
        run: docker run --rm -v "$PWD":/work -w /work "${{ steps.image.outputs.image }}" bash -lc 'python3 tools/spec_check.py'
      - name: Browser harnesses
        run: docker run --rm --shm-size=1g -v "$PWD":/work -w /work "${{ steps.image.outputs.image }}" bash -lc 'tools/run_assurance.sh --browser'
