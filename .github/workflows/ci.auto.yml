# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: ci

# The libraries of commons (commons 0001-libraries FR-012, 0027-commons-libraries FR-019 to FR-022): one workflow for every library. The job `plan` reads what the push or pull request changed, from the commit it starts at,
# and the libraries that change affects (their folders, what they import and what depends on them); `verify` and the tests on Node 26 run for those libraries on Linux, and on Windows and macOS only for the libraries whose
# record of CI (`LIBRARY_CI`) names them, because they have code of their own for those systems. Nothing else is run. The job `ci` is the one result to require.
on:
  push:
    paths:
      - "commons/**"
      - package.json
      - bun.lock
      - ".github/actions/bun/**"
      - .github/workflows/ci.auto.yml
  pull_request:
    paths:
      - "commons/**"
      - package.json
      - bun.lock
      - ".github/actions/bun/**"
      - .github/workflows/ci.auto.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-linux: ${{ steps.plan.outputs.has-linux }}
      linux: ${{ steps.plan.outputs.linux }}
      has-systems: ${{ steps.plan.outputs.has-systems }}
      systems: ${{ steps.plan.outputs.systems }}
    steps:
      # the whole history: the plan compares the head with the commit the change starts at
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "The libraries this change affects, and the systems each runs on"
        id: plan
        shell: bash
        run: |
          # a pull request starts at its base; a push to main at the commit main was at; any other branch at main, so a push that replaced a run that was stopped still carries what that run was to prove
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then base="${{ github.event.before }}"
          else base=origin/main; fi
          case "$base" in ""|0000000000000000000000000000000000000000) base=origin/main ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = schedule ]; then scope=--all; else scope="--base $base"; fi
          bun commons/libraries/src/plan.ts $scope --github-output "$GITHUB_OUTPUT"
          # the proof plan of the same change (commons repoctl 0008-repoctl-prove), written to the summary of the run: what a person would run, and why each skipped proof is safe; it gates nothing, the matrices above do
          { echo '### Proof plan'; echo '```'; bun commons/repoctl/src/repoctl.ts prove --tier 6 --why $scope 2>&1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan]
    if: "needs.plan.outputs.has-linux == 'true'"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        run: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
      - name: "verify (its packing is checked where the exports changed, and by the release)"
        run: ${{ matrix.verify }}
        env:
          IFC_SKIP_PACK: ${{ matrix.pack == false && '1' || '' }}
        working-directory: ${{ matrix.folder }}
      - name: After verify
        if: "matrix.after != ''"
        shell: bash
        run: ${{ matrix.after }}
        working-directory: ${{ matrix.folder }}
      - name: The tests on Node 26
        if: "matrix.node != ''"
        shell: bash
        run: ${{ matrix.node }}
        working-directory: ${{ matrix.folder }}

  systems:
    name: verify (${{ matrix.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [plan]
    if: "needs.plan.outputs.has-systems == 'true'"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.systems) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        run: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
      - name: "verify (its packing is checked where the exports changed, and by the release)"
        run: ${{ matrix.verify }}
        env:
          IFC_SKIP_PACK: ${{ matrix.pack == false && '1' || '' }}
        working-directory: ${{ matrix.folder }}
      - name: After verify
        if: "matrix.after != ''"
        shell: bash
        run: ${{ matrix.after }}
        working-directory: ${{ matrix.folder }}
      - name: The tests on Node 26
        if: "matrix.node != ''"
        shell: bash
        run: ${{ matrix.node }}
        working-directory: ${{ matrix.folder }}

  # The one result to require: every job it needs passed or had nothing to run.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, verify, systems]
    if: "always()"
    steps:
      - name: No job failed
        shell: bash
        run: |
          for r in "${{ needs.plan.result }}" "${{ needs.verify.result }}" "${{ needs.systems.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job of ci ended $r"; exit 1 ;; esac
          done
