# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: ci

# The libraries of commons (commons 0001-libraries FR-012, 0027-commons-libraries FR-019 to FR-022): one workflow for every library. The job `plan` reads what the push or pull request changed, from the commit it starts at,
# and the libraries that change affects (their folders, what they import and what depends on them); `verify` and the tests on Node 26 run for those libraries on Linux, and on Windows and macOS only for the libraries whose
# record of CI (`LIBRARY_CI`) names them, because they have code of their own for those systems. Nothing else is run. The job `ci` is the one result to require.
on:
  push:
    paths:
      - "commons/**"
      - package.json
      - bun.lock
      - ".github/actions/bun/**"
      - .github/workflows/ci.auto.yml
  pull_request:
    paths:
      - "commons/**"
      - package.json
      - bun.lock
      - ".github/actions/bun/**"
      - .github/workflows/ci.auto.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # whether this commit was proved already by a run of this workflow (0030-generated-workflows FR-015): only a push to a branch other than main can be, and the answer is not proved where GitHub cannot be asked
  seen:
    name: seen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proved: ${{ steps.seen.outputs.proved }}
    steps:
      - name: Whether this commit has a run of this workflow that succeeded
        id: seen
        shell: bash
        run: |
          proved=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            # an earlier run of this workflow on the same commit that succeeded or is still going (the run of main that the push of the branch follows); the earliest run is never skipped, so two pushes at once do not skip each other
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$GITHUB_SHA&per_page=50" --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status != \"completed\")] | length" 2>/dev/null) || n=0
            case "$n" in ""|*[!0-9]*) n=0 ;; esac
            if [ "$n" -gt 0 ]; then proved=true; fi
          fi
          echo "proved=$proved" >> "$GITHUB_OUTPUT"
          echo "commit $GITHUB_SHA on $GITHUB_REF: proved before = $proved" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ci.auto.yml
        continue-on-error: true

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [seen]
    if: "needs.seen.outputs.proved != 'true'"
    outputs:
      has-linux: ${{ steps.plan.outputs.has-linux }}
      linux: ${{ steps.plan.outputs.linux }}
      has-systems: ${{ steps.plan.outputs.has-systems }}
      systems: ${{ steps.plan.outputs.systems }}
    steps:
      # the whole history: the plan compares the head with the commit the change starts at
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "The libraries this change affects, and the systems each runs on"
        id: plan
        shell: bash
        run: |
          # a pull request starts at its base; a push to main at the commit main was at; any other branch at main, so a push that replaced a run that was stopped still carries what that run was to prove
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then base="${{ github.event.before }}"
          else base=origin/main; fi
          case "$base" in ""|0000000000000000000000000000000000000000) base=origin/main ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = schedule ]; then scope=--all; else scope="--base $base"; fi
          bun commons/libraries/src/plan.ts $scope --github-output "$GITHUB_OUTPUT"
          # the proof plan of the same change (commons repoctl 0008-repoctl-prove), written to the summary of the run: what a person would run, and why each skipped proof is safe; it gates nothing, the matrices above do
          { echo '### Proof plan'; echo '```'; bun commons/repoctl/src/repoctl.ts prove --tier 6 --why $scope 2>&1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan]
    if: "needs.plan.outputs.has-linux == 'true'"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        id: the-development-tools-from-bun-lock-the--3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-development-tools-from-bun-lock-the--3 --job "verify" --module "${{ matrix.name }}" --tool install --timeout 6 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "verify (its packing is checked where the exports changed, and by the release)"
        id: verify-its-packing-is-checked-where-the--4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id verify-its-packing-is-checked-where-the--4 --job "verify" --module "${{ matrix.name }}" --tool verify --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_SKIP_PACK: ${{ matrix.pack == false && '1' || '' }}
          IFC_SHARD: ${{ matrix.shard }}
          IFC_STEP_SCRIPT: ${{ matrix.verify }}
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: After verify
        id: after-verify-5
        if: "matrix.after != ''"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id after-verify-5 --job "verify" --module "${{ matrix.name }}" --tool verify --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: ${{ matrix.after }}
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: The tests on Node 26
        id: the-tests-on-node-26-6
        if: "matrix.node != ''"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-tests-on-node-26-6 --job "verify" --module "${{ matrix.name }}" --tool bun-test --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_SHARD: ${{ matrix.shard }}
          IFC_STEP_SCRIPT: ${{ matrix.node }}
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-ci-verify-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  systems:
    name: verify (${{ matrix.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [plan]
    if: "needs.plan.outputs.has-systems == 'true'"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.systems) }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        id: the-development-tools-from-bun-lock-the--3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-development-tools-from-bun-lock-the--3 --job "systems" --module "${{ matrix.name }}" --tool install --timeout 6 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "verify (its packing is checked where the exports changed, and by the release)"
        id: verify-its-packing-is-checked-where-the--4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id verify-its-packing-is-checked-where-the--4 --job "systems" --module "${{ matrix.name }}" --tool verify --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_SKIP_PACK: ${{ matrix.pack == false && '1' || '' }}
          IFC_SHARD: ${{ matrix.shard }}
          IFC_STEP_SCRIPT: ${{ matrix.verify }}
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: After verify
        id: after-verify-5
        if: "matrix.after != ''"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id after-verify-5 --job "systems" --module "${{ matrix.name }}" --tool verify --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: ${{ matrix.after }}
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: The tests on Node 26
        id: the-tests-on-node-26-6
        if: "matrix.node != ''"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-tests-on-node-26-6 --job "systems" --module "${{ matrix.name }}" --tool bun-test --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_SHARD: ${{ matrix.shard }}
          IFC_STEP_SCRIPT: ${{ matrix.node }}
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-ci-systems-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this workflow, gathered: it passes if and only if the pipeline is sound (0038-build-policy FR-005); a failing test, a type error or a crashed command in any cell is a finding here and never a red job
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [seen, plan, verify, systems]
    if: "always() && needs.seen.outputs.proved != 'true'"
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/bun
        with:
          tools: "false"
      - name: The findings every job kept
        uses: actions/download-artifact@v4
        with:
          pattern: "findings-ci-*"
          path: _findings
          merge-multiple: true
        continue-on-error: true
      - name: "The findings, merged; the pipeline is sound where every cell that ran left its file (ci/collect.ts)"
        shell: bash
        run: |
          set -u
          empty='{}'
          if [ "$PLAN_RESULT" != "success" ]; then echo "the plan could not be made (the red cause plan-unavailable)"; exit 2; fi
          n_linux=$(jq '[(.include // [])[].name] | unique | length' <<<"${PLAN_LINUX:-$empty}")
          n_systems=$(jq '[(.include // [])[].name] | unique | length' <<<"${PLAN_SYSTEMS:-$empty}")
          bun commons/libraries/src/ci/collect.ts --dir _findings --out _findings-out --workflow ci --expect "verify:$n_linux" --expect "systems:$n_systems" --policy-review --check-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ci
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_LINUX: ${{ needs.plan.outputs.linux }}
          PLAN_SYSTEMS: ${{ needs.plan.outputs.systems }}
      - name: "The merged findings, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-ci
          path: _findings-out
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this run added to the history branch (0038-build-policy FR-012): main only, the one job with the permission to write the repository's contents, never a red run
  keep-findings:
    name: keep-findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [ci]
    if: "always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        with:
          tools: "false"
        continue-on-error: true
      - name: The merged findings of this workflow
        uses: actions/download-artifact@v4
        with:
          name: findings-ci
          path: _findings-merged
        continue-on-error: true
      - name: "The findings added to the history branch (the only writer)"
        shell: bash
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bun commons/libraries/src/ci/history.ts --file _findings-merged/findings.json --remote "https://github.com/$GITHUB_REPOSITORY.git"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
