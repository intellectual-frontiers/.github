# Generated by bun commons/ts/tools/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: quality-publish

# Publishes quality (commons 0027-commons-libraries FR-015, FR-016): a tag `quality-v<version>` (made by `versions tag`, commons 0026-works-versioning), or a run by hand from main, is checked against the package's version, the library is proved and packed by its own
# tools/pack.ts, and the tarball goes to the registries its manifest names: npm with provenance and no token (trusted publishing, which the owner of the npm scope sets up once for this workflow's file), and
# the GitHub package registry with this workflow's own token.
on:
  push:
    tags:
      - "quality-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: commons/quality
      - name: "The tag, or main for a run by hand, is the version of the package"
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "quality-v$version" || { echo "the tag $GITHUB_REF_NAME is not quality-v$version"; exit 1; }
          else
            test "$GITHUB_REF" = refs/heads/main || { echo "a run by hand publishes only from main, not $GITHUB_REF"; exit 1; }
          fi
        working-directory: commons/quality
      - name: verify
        run: bun run verify
        working-directory: commons/quality
      - name: The package that is published
        run: bun tools/pack.ts
        working-directory: commons/quality
      - name: "The tarball, kept for the jobs that publish it"
        uses: actions/upload-artifact@v4
        with:
          name: quality-package
          path: "commons/quality/dist/*.tgz"
          if-no-files-found: error

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - name: The tarball
        uses: actions/download-artifact@v4
        with:
          name: quality-package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: "Is the version already on npm (published by hand, or by an earlier run)?"
        id: have
        shell: bash
        run: |
          pkg=$(tar -xzOf ./*.tgz package/package.json)
          name=$(printf '%s' "$pkg" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          version=$(printf '%s' "$pkg" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already there"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: package
      - name: "Published to npm, with provenance and no token"
        if: "steps.have.outputs.have != 'true'"
        shell: bash
        run: "npm publish \"$(ls ./*.tgz)\" --access public --provenance"
        working-directory: package

  publish-github:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: The tarball
        uses: actions/download-artifact@v4
        with:
          name: quality-package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@intellectual-frontiers"
      - name: "Is the version already on the GitHub package registry?"
        id: have
        shell: bash
        run: |
          pkg=$(tar -xzOf ./*.tgz package/package.json)
          name=$(printf '%s' "$pkg" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          version=$(printf '%s' "$pkg" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if npm view "$name@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$version is already there"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: package
      - name: Published to the GitHub package registry
        if: "steps.have.outputs.have != 'true'"
        shell: bash
        run: "npm publish \"$(ls ./*.tgz)\""
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: package

  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, publish-npm, publish-github]
    if: "always() && needs.build.result == 'success' && github.ref_type == 'branch'"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The tag of the version that is published, made once"
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="quality-v$version"
          npm view "@intellectual-frontiers/quality@$version" version >/dev/null 2>&1 || { echo "$version is not on npm: no tag"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already there"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: commons/quality
