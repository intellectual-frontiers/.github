# Runs every design system's assurance harness on every push and pull request that touches a design system or the
# command line that runs them (0014-design-systems FR-015, FR-017, FR-039; 0042-agora FR-022): the browser harnesses
# (web, slides, course and brand design systems) and the Open edX package in one job, the Python harnesses (print on
# TeX Live, merchandise, figure, slides, course, media, signage, email and voice design systems) in another, each
# under every brand here, and each brand's imagery pool and share card in a third. A job installs only the programs
# outside Python its suite needs, then Python and uv; agora installs its own packages from its hashed lock
# (0025-tooling-environment FR-011, FR-013).
name: design-systems

on:
  push:
    paths: ["design-systems/**", "agora", "tools/agora/**", ".github/workflows/design-systems.yml"]
  pull_request:
    paths: ["design-systems/**", "agora", "tools/agora/**", ".github/workflows/design-systems.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: ImageMagick (a brand without a favicon.ico draws one with `convert`)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser harnesses
        run: ./agora check --suite browser
      - name: Open edX brand package, rebuilt with Paragon
        run: |
          npm install --prefix "$RUNNER_TEMP/paragon" --no-audit --no-fund @openedx/paragon@23.23.0
          ./agora check openedx --scope frontiers-brand
        env:
          PARAGON: ${{ runner.temp }}/paragon/node_modules/.bin/paragon

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: TeX Live, poppler, librsvg and ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-xetex texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-science latexmk poppler-utils librsvg2-bin imagemagick
      - name: Python harnesses (print on TeX Live, merchandise, figures, and the rest)
        run: ./agora check --suite python

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick
      - name: Brand imagery
        run: ./agora check --suite images
