# Runs every design system's assurance harness on every push and pull request that touches a design system
# (0014-design-systems FR-015, FR-017, FR-039): the browser harnesses (web and brand design systems) in one job,
# the Python harnesses (print, merchandise and figure design systems) in another, each under every brand here, and each brand's imagery
# pool and share card in a third.
name: design-systems

on:
  push:
    paths: ["design-systems/**", "tools/run_assurance.sh", "tools/brand_imagery.py", "tools/brand_decoration.py", ".github/workflows/design-systems.yml"]
  pull_request:
    paths: ["design-systems/**", "tools/run_assurance.sh", "tools/brand_imagery.py", "tools/brand_decoration.py", ".github/workflows/design-systems.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser harnesses
        run: tools/run_assurance.sh --browser

  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: TeX Live, poppler, Pillow and librsvg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-xetex texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-science latexmk poppler-utils python3-pil librsvg2-bin
      - name: Python harnesses (print on TeX Live, merchandise, figures)
        run: tools/run_assurance.sh --tex

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick webp
      - name: Brand imagery
        run: tools/run_assurance.sh --images
