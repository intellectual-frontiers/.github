# Runs every design system's assurance harness on every push and pull request that touches a design system, the
# orchestrator that runs them or the toolchain lock (0014-design-systems FR-015, FR-017, FR-039; 0042-agora FR-022): the
# browser harnesses (web, slides, course and brand design systems) and the Open edX package in one job, the Python
# harnesses (print on TeX, merchandise, figure, slides, course, media, signage, email and voice design systems) in
# another, each under every brand here, and each brand's imagery pool and share card in a third.
#
# A job is a stock runner given only Python and uv (0025-tooling-environment FR-011, FR-022): agora installs the locked
# Python packages itself and fetches, verifies and caches every other program it runs (TinyTeX and its packages, Chromium,
# Playwright and Paragon from the npm lock) the first time a command needs it. The restored cache only saves the fetch; a
# run with an empty cache passes, only slower (0025 FR-023). The one step beyond that is the documented one-time setup,
# `./agora system add --yes`, which installs Chromium's shared libraries with sudo when the runner lacks any, and does
# nothing when it lacks none (0025 FR-021).
name: design-systems

on:
  push:
    paths: ["design-systems/**", "agora", "tools/agora/**", "tools/if-console/**", ".github/workflows/design-systems.yml"]
  pull_request:
    paths: ["design-systems/**", "agora", "tools/agora/**", "tools/if-console/**", ".github/workflows/design-systems.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agora
          key: agora-toolchain-${{ runner.os }}-${{ hashFiles('tools/agora/toolchain/**', 'tools/agora/npm/package-lock.json', 'tools/agora/core/toolchain.py') }}
      - name: Chromium's system libraries (one-time setup; nothing to do when the runner has them)
        run: ./agora system add --yes
      - name: Browser harnesses and the Open edX package, rebuilt with Paragon
        run: ./agora check --suite browser

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agora
          key: agora-toolchain-${{ runner.os }}-${{ hashFiles('tools/agora/toolchain/**', 'tools/agora/core/toolchain.py') }}
      - name: Python harnesses (print on TinyTeX, merchandise, figures, and the rest)
        run: ./agora check --suite python

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Brand imagery
        run: ./agora check --suite images

  # The IF Console extension (0043-if-console FR-028, FR-032): its unit tests on Node, and its tests inside a real VS Code under a
  # display server. VS Code's shared libraries and the display server are the documented one-time setup.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agora
          key: agora-toolchain-${{ runner.os }}-${{ hashFiles('tools/agora/toolchain/**', 'tools/if-console/package-lock.json', 'tools/agora/core/toolchain.py') }}
      - name: VS Code's system libraries and the display server (one-time setup; nothing to do when the runner has them)
        run: ./agora system add --yes
      - name: The extension, on Node and in a real VS Code
        run: ./agora check --suite extension
