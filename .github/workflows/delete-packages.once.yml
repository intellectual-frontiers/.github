name: delete-packages-once

# A one-off: lists the npm packages of the organization that are linked to this repository on the GitHub package registry and, where asked, deletes them.
on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Delete the listed packages (without it the run only lists them)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The packages, and their deletion where asked
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE: ${{ inputs.delete }}
        run: |
          set -euo pipefail
          org=intellectual-frontiers
          names=$(gh api --paginate "/orgs/$org/packages?package_type=npm&per_page=100" --jq '.[] | select(.repository.full_name == "intellectual-frontiers/.github") | .name')
          echo "linked npm packages: $(echo "$names" | grep -c . || true)"
          echo "$names"
          if [ "$DELETE" = "true" ]; then
            for n in $names; do
              enc=$(jq -rn --arg n "$n" '$n|@uri')
              if gh api -X DELETE "/orgs/$org/packages/npm/$enc"; then echo "deleted $n"; else echo "FAILED  $n"; fi
            done
          fi
