name: data

# IFC data, an independent library of commons (commons 0027-commons-libraries FR-010): its own `verify` (the compiler, the specification checker and the rules on its own
# spec kit, and its tests) on Bun, and its tests on Node 26, the backup runtime (commons 0005-typescript-runtime). It runs when its folder changes or what it imports does:
# the kernel and the runtime, the specification tools, and the Bun action.
on:
  push:
    paths:
      - "commons/data/**"
      - "commons/ts/kernel/**"
      - "commons/ts/runtime/**"
      - "commons/ts/mizan/**"
      - "commons/tools/**"
      - ".github/workflows/data.yml"
      - ".github/actions/bun/**"
  pull_request:
    paths:
      - "commons/data/**"
      - "commons/ts/kernel/**"
      - "commons/ts/runtime/**"
      - "commons/ts/mizan/**"
      - "commons/tools/**"
      - ".github/workflows/data.yml"
      - ".github/actions/bun/**"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: The development tools, from bun.lock (the kernel is linked from commons/ts)
        working-directory: commons/data
        run: bun install --frozen-lockfile
      - name: verify
        working-directory: commons/data
        run: bun run verify

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The development tools, from bun.lock
        working-directory: commons/data
        run: bun install --frozen-lockfile
      - name: The tests on Node 26
        working-directory: commons/data
        run: node --test "suite/**/*.test.ts"
