# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: site

# The documentation site of commons (commons 0011-documentation FR-020, FR-041, FR-042): made by commons/docs, from commons' TypeScript and spec kit and, beside them, the evidence of quality. Every pull request
# and push that touches commons tests the generator and checks the site (no finding, every link and anchor resolves). A push to main also runs the tests of every library and of the repository's own `tests/`, one job
# for each, keeps each run's CTRF report (commons/docs/tools/evidence.ts), fetches the open issues of the repository, builds the site from them and publishes it to GitHub Pages with GitHub's own actions: the site is
# published whether or not a test failed, since its Quality section is how a failure is seen. A library whose run cannot be made has none recorded. The site is never committed.
on:
  push:
    paths:
      - "commons/**"
      - package.json
      - .github/workflows/site.auto.yml
      - ".github/actions/bun/**"
  pull_request:
    paths:
      - "commons/**"
      - package.json
      - .github/workflows/site.auto.yml
      - ".github/actions/bun/**"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "TypeScript 7.1 (beta), Shiki, beautiful-mermaid and @types/node, exactly as bun.lock pins them"
        run: bun install --frozen-lockfile
        working-directory: commons/docs
      - name: "The compiler, the generator's tests, then check on commons"
        run: bun run verify
        working-directory: commons/docs

  # the libraries whose tests are run for the evidence: every one the plan knows, as a push that touched every library would run them
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "Every library, as a matrix"
        id: plan
        shell: bash
        run: "bun commons/libraries/src/plan.ts --all --github-output \"$GITHUB_OUTPUT\""

  # the tests of one library, whose result is kept whether they pass or fail
  evidence:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [plan]
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        run: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "The test runner's own packages (commons quality)"
        run: bun install --frozen-lockfile
        working-directory: commons/quality
      - name: "The tests, kept as a CTRF report"
        shell: bash
        run: "bun commons/docs/tools/evidence.ts --library \"${{ matrix.name }}\" --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "The report, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence/*.ctrf.json
          if-no-files-found: ignore
          retention-days: 3

  # the tests of the repository's own files (`tests/`)
  repository:
    name: "tests (repository)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The root's development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: .
      - name: "The documentation generator's dependencies, which the tests of the root import"
        run: bun install --frozen-lockfile
        working-directory: commons/docs
      - name: "The test runner's own packages (commons quality)"
        run: bun install --frozen-lockfile
        working-directory: commons/quality
      - name: "The libraries, linked by name"
        run: bun commons/libraries/src/link.ts
      - name: "The tests, kept as a CTRF report"
        shell: bash
        run: "bun commons/docs/tools/evidence.ts --library repository --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "The report, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-repository
          path: ${{ runner.temp }}/evidence/*.ctrf.json
          if-no-files-found: ignore
          retention-days: 3

  # the site, built from the sources and the evidence: it is built whether or not a test failed, and whether or not a library's run could be made
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [check, evidence, repository]
    if: "always() && needs.check.result == 'success' && (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')"
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "TypeScript 7.1 (beta), Shiki, beautiful-mermaid and @types/node, exactly as bun.lock pins them"
        run: bun install --frozen-lockfile
        working-directory: commons/docs
      - name: The reports of the tests
        uses: actions/download-artifact@v4
        with:
          pattern: "evidence-*"
          path: _evidence
          merge-multiple: true
      - name: "The open issues of the repository, and which run this is"
        shell: bash
        run: |
          mkdir -p _evidence
          # each page of the answer is an array: the pages are made one
          gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=all -f per_page=100 --jq '.[]' | jq -s '.' > _evidence/github-issues.json || echo '[]' > _evidence/github-issues.json
          printf '{ "commit": "%s", "at": "%s", "url": "%s" }\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > _evidence/meta.json
          ls -l _evidence | head -80
        env:
          GH_TOKEN: ${{ github.token }}
      - name: "The site, built"
        run: "bun src/main.ts build --out \"$GITHUB_WORKSPACE/_site\""
        working-directory: commons/docs
      - name: "The site, kept for Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # always(): a library whose run failed is an ancestor that failed, and would otherwise skip the publication of a site that was built
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [site]
    if: "always() && needs.site.result == 'success' && (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')"
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Published to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
