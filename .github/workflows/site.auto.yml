# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: site

# The documentation site of commons (commons 0011-documentation FR-020, FR-041, FR-042): made by commons/docs, from commons' TypeScript and spec kit and, beside them, the evidence of quality. Every pull request and push that
# touches commons tests the generator and checks the site (no finding, every link and anchor resolves): that gates a pull request and nothing else. A push to main builds the site in a few minutes from the newest evidence the
# workflow `evidence` has kept (the tests of every library, with how old they are), the open issues and the runs of the workflows, and publishes it to GitHub Pages with GitHub's own actions WHATEVER failed: the generator's check, a
# library's tests, the evidence run, even the build, for which an emergency page is made from the evidence alone. The site is how a failure is seen. It is never committed.
on:
  push:
    paths:
      - .github/workflows/site.auto.yml
  pull_request:
    paths:
      - "commons/**"
      - package.json
      - bun.lock
      - .github/workflows/site.auto.yml
      - ".github/actions/bun/**"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"
  workflow_run:
    workflows: [evidence, ci, release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # gates a pull request; on main its result is shown on the site and stops nothing. A refresh of the site after a workflow, or by the night, does not run it.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: "github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'"
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "TypeScript 7.1 (beta), Shiki, beautiful-mermaid and @types/node, exactly as bun.lock pins them"
        id: typescript-7-1-beta-shiki-beautiful-merm-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id typescript-7-1-beta-shiki-beautiful-merm-3 --job "check" --module "repository" --tool install --timeout 4 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: "The compiler, the generator's tests, then check on commons"
        id: the-compiler-the-generator-s-tests-then--4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-compiler-the-generator-s-tests-then--4 --job "check" --module "repository" --tool verify --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun run verify
        working-directory: commons/docs
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-site-check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the site, built from the sources and the evidence, whatever else failed; where the build itself fails, a page made from the evidence alone
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [check]
    if: "always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'cancelled'))"
    permissions:
      contents: read
      issues: read
      actions: read
      packages: read
    steps:
      # the whole history, for the page of hotspots and owners
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "TypeScript 7.1 (beta), Shiki, beautiful-mermaid and @types/node, exactly as bun.lock pins them"
        id: typescript-7-1-beta-shiki-beautiful-merm-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id typescript-7-1-beta-shiki-beautiful-merm-3 --job "site" --module "repository" --tool install --timeout 6 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: The newest test reports
        id: the-newest-test-reports-4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-newest-test-reports-4 --job "site" --module "repository" --tool exit-status --timeout 10 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          GH_TOKEN: ${{ github.token }}
          IFC_STEP_SCRIPT: |
            mkdir -p _evidence
            # the newest evidence the workflow `evidence` kept, whatever its result; none is a site that says no run is recorded
            gh run download --name evidence --dir _evidence || echo 'no evidence has been kept yet'
        continue-on-error: true
      - name: "The findings of the runs, from the history branch, and the accepted risks"
        id: the-findings-of-the-runs-from-the-histor-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-findings-of-the-runs-from-the-histor-5 --job "site" --module "repository" --tool exit-status --timeout 10 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            mkdir -p _evidence/findings-history
            # the findings of the runs, which the workflows keep on the branch findings-history, laid out for the page of build findings (0038-build-policy FR-012), and the accepted risks as data
            git fetch -q origin findings-history:refs/remotes/origin/findings-history || echo 'no findings history has been kept yet'
            git archive --format=tar refs/remotes/origin/findings-history runs 2>/dev/null | tar -x -C _evidence/findings-history || echo 'no findings history to lay out'
            bun commons/libraries/src/ci/accepted.ts --json _evidence/accepted-findings.json || echo 'the accepted risks could not be read'
        continue-on-error: true
      - name: "The open issues, the runs of the workflows, and which build this is"
        id: the-open-issues-the-runs-of-the-workflow-6
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-open-issues-the-runs-of-the-workflow-6 --job "site" --module "repository" --tool exit-status --timeout 10 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          GH_TOKEN: ${{ github.token }}
          IFC_STEP_SCRIPT: |
            mkdir -p _evidence
            # each page of the answer is an array: the pages are made one; the issues and the runs are asked for at the same time (0011-documentation FR-020)
            (gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=all -f per_page=100 --jq '.[]' | jq -s '.' > _evidence/github-issues.json || echo '[]' > _evidence/github-issues.json) &
            (bun commons/docs/tools/ci-runs.ts --out _evidence/runs.json || echo 'the runs of the workflows could not be read') &
            wait
            printf '{ "commit": "%s", "at": "%s", "url": "%s", "check": "%s" }\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "${{ needs.check.result }}" > _evidence/build.json
            ls -l _evidence | sed -n '1,80p'
        continue-on-error: true
      - name: The versions the package registry holds
        id: registry
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id registry --job "site" --module "repository" --tool exit-status --timeout 10 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          GH_TOKEN: ${{ github.token }}
          IFC_STEP_SCRIPT: |
            mkdir -p _evidence
            # the versions the package registry holds, with their days: the version in the heading of every page (docs 0001-docs FR-033, FR-039). A registry that cannot be read is a file that says why, which the site shows as a finding, never a stop.
            set -o pipefail
            if gh api --paginate -X GET "/orgs/$GITHUB_REPOSITORY_OWNER/packages/npm/commons/versions" -f per_page=100 --jq '.[]' | jq -s '{ versions: [ .[] | { version: .name, createdAt: .created_at } ] }' > _evidence/registry.json.new; then mv _evidence/registry.json.new _evidence/registry.json; else rm -f _evidence/registry.json.new; printf '{ "error": "the package registry could not be read with the token of this job" }\n' > _evidence/registry.json; fi
            cat _evidence/registry.json | head -c 600
        continue-on-error: true
      - name: "The packages of the one package's own tools (commons commons)"
        id: the-packages-of-the-one-package-s-own-to-8
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-packages-of-the-one-package-s-own-to-8 --job "site" --module "repository" --tool install --timeout 6 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/commons
        continue-on-error: true
      - name: "The package, measured"
        id: package
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id package --job "site" --module "repository" --tool install --timeout 6 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            # what the packer says of the package at this commit, for the pages of the package (docs 0001-docs FR-032, FR-034, FR-039); where it cannot be made, no file is kept and the pages say nothing was measured
            bun install --frozen-lockfile
            bun commons/libraries/src/link.ts
            (cd commons/commons && bun tools/pack.ts --size > "$RUNNER_TEMP/pack.log" 2>&1; tail -n 5 "$RUNNER_TEMP/pack.log")
            cp commons/commons/dist/package-report.json _evidence/package.report.json || echo 'the package could not be measured'
        continue-on-error: true
      - name: "The site, built"
        id: build
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id build --job "site" --module "repository" --tool exit-status --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "set -o pipefail; bun src/main.ts build --out \"$GITHUB_WORKSPACE/_site\" 2>&1 | tee \"$RUNNER_TEMP/build.log\""
        working-directory: commons/docs
        continue-on-error: true
      - name: "The emergency page, where the build failed"
        id: the-emergency-page-where-the-build-faile-11
        if: "steps.build.outputs.outcome != 'success'"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-emergency-page-where-the-build-faile-11 --job "site" --module "repository" --tool exit-status --timeout 16 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "bun tools/status-site.ts --evidence \"$GITHUB_WORKSPACE/_evidence\" --log \"$RUNNER_TEMP/build.log\" --out \"$GITHUB_WORKSPACE/_site\""
        working-directory: commons/docs
        continue-on-error: true
      - name: "The site, kept for Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-site-site-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # always(): whatever failed before is an ancestor that failed, and would otherwise skip the publication of a site that was built
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [site]
    if: "always() && needs.site.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'cancelled'))"
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Published to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # the findings of this workflow, gathered: it passes if and only if the pipeline is sound (0038-build-policy FR-005); a failing test, a type error or a crashed command in any cell is a finding here and never a red job
  findings:
    name: findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [check, site, publish]
    if: "always()"
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/bun
      - name: The findings every job kept
        uses: actions/download-artifact@v4
        with:
          pattern: "findings-site-*"
          path: _findings
          merge-multiple: true
        continue-on-error: true
      - name: "The findings, merged; the pipeline is sound where every cell that ran left its file (ci/collect.ts)"
        shell: bash
        run: |
          set -u
          empty='{}'
          bun commons/libraries/src/ci/collect.ts --dir _findings --out _findings-out --workflow site  --check-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: site
      - name: "The merged findings, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-site
          path: _findings-out
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this run added to the history branch (0038-build-policy FR-012): main only, the one job with the permission to write the repository's contents, never a red run
  keep-findings:
    name: keep-findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [findings]
    if: "always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: The merged findings of this workflow
        uses: actions/download-artifact@v4
        with:
          name: findings-site
          path: _findings-merged
        continue-on-error: true
      - name: "The findings added to the history branch (the only writer)"
        shell: bash
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bun commons/libraries/src/ci/history.ts --file _findings-merged/findings.json --remote "https://github.com/$GITHUB_REPOSITORY.git"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
