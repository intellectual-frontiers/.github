# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: evidence

# The evidence of quality for the documentation site (commons 0011-documentation FR-042): the tests of every library and of the repository's own `tests/`, one job for each, each kept as a CTRF report with a status file that says why
# there is none (the packages could not be installed, there is no suite, the run timed out). By the hour and by hand, never on a push. The jobs `tests` and `repository` never fail the workflow for what they find: a failed test is what the
# site is to show. The job `collect` gathers every report into the artifact `evidence`, which the workflow `site` downloads on each push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  # every library the plan knows, as a matrix
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "Every library, as a matrix"
        id: plan
        shell: bash
        run: "bun commons/libraries/src/plan.ts --all --github-output \"$GITHUB_OUTPUT\""

  # the tests of one library, whose result is kept whether they pass, fail or cannot be run
  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        id: install
        run: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "The test runner's own packages (commons quality)"
        id: runner
        run: bun install --frozen-lockfile
        working-directory: commons/quality
        continue-on-error: true
      - name: "The tests, kept as a CTRF report"
        id: tests
        shell: bash
        run: "bun commons/docs/tools/evidence.ts --library \"${{ matrix.name }}\" --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "Why there is a report, or none"
        if: "always()"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          printf '{ "library": "%s", "install": "%s", "runner": "%s", "tests": "%s", "reported": %s }\n' "${{ matrix.name }}" "${{ steps.install.outcome }}" "${{ steps.runner.outcome }}" "${{ steps.tests.outcome }}" "$(test -f "$RUNNER_TEMP/evidence/${{ matrix.name }}.ctrf.json" && echo true || echo false)" > "$RUNNER_TEMP/evidence/status-${{ matrix.name }}.json"
      - name: "The report and its status, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence/*.json
          if-no-files-found: ignore
          retention-days: 7

  # the tests of the repository's own files (`tests/`)
  repository:
    name: "tests (repository)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The root's development tools, from bun.lock"
        id: install
        run: bun install --frozen-lockfile
        working-directory: .
        continue-on-error: true
      - name: "The documentation generator's dependencies, which the tests of the root import"
        run: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: "The test runner's own packages (commons quality)"
        id: runner
        run: bun install --frozen-lockfile
        working-directory: commons/quality
        continue-on-error: true
      - name: "The libraries, linked by name"
        run: bun commons/libraries/src/link.ts
        continue-on-error: true
      - name: "The tests, kept as a CTRF report"
        id: tests
        shell: bash
        run: "bun commons/docs/tools/evidence.ts --library repository --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "Why there is a report, or none"
        if: "always()"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          printf '{ "library": "repository", "install": "%s", "runner": "%s", "tests": "%s", "reported": %s }\n' "${{ steps.install.outcome }}" "${{ steps.runner.outcome }}" "${{ steps.tests.outcome }}" "$(test -f "$RUNNER_TEMP/evidence/repository.ctrf.json" && echo true || echo false)" > "$RUNNER_TEMP/evidence/status-repository.json"
      - name: "The report and its status, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-repository
          path: ${{ runner.temp }}/evidence/*.json
          if-no-files-found: ignore
          retention-days: 7

  # every report in one artifact, whatever happened to the jobs that made them
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [tests, repository]
    if: "always()"
    steps:
      - uses: actions/checkout@v4
      - name: The reports of the tests
        uses: actions/download-artifact@v4
        with:
          pattern: "evidence-*"
          path: _evidence
          merge-multiple: true
      - name: Which run this is
        shell: bash
        run: |
          mkdir -p _evidence
          printf '{ "commit": "%s", "at": "%s", "url": "%s" }\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > _evidence/meta.json
          ls -l _evidence | head -200
      - name: "The evidence, kept for the site"
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: _evidence
          retention-days: 7
