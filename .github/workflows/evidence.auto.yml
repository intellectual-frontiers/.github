# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: evidence

# The evidence of quality for the documentation site (commons 0011-documentation FR-042): the tests of every library and of the repository's own `tests/`, one job for each, each kept as a CTRF report with a status file that says why
# there is none (the packages could not be installed, there is no suite, the run timed out). By the hour and by hand, never on a push. The jobs `tests` and `repository` never fail the workflow for what they find: a failed test is what the
# site is to show. The job `collect` gathers every report into the artifact `evidence`, which the workflow `site` downloads on each push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "43 3 * * *"

permissions:
  contents: read

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  # every library the plan knows, as a matrix
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - name: "The packages the plan reads, from the root's bun.lock"
        run: bun install --frozen-lockfile
      - name: "The libraries, linked by name before any of them is imported (the root's packages are old copies from npm)"
        run: bun commons/libraries/src/link.ts
      - name: "Every library, as a matrix"
        id: plan
        shell: bash
        run: "bun commons/libraries/src/plan.ts --all --github-output \"$GITHUB_OUTPUT\""

  # the tests of one library, whose result is kept whether they pass, fail or cannot be run
  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        id: install
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id install --job "tests" --module "${{ matrix.name }}" --tool install --timeout 7 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: ${{ matrix.folder }}
        continue-on-error: true
      - name: "The test runner's own packages (commons quality)"
        id: runner
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id runner --job "tests" --module "${{ matrix.name }}" --tool install --timeout 7 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/quality
        continue-on-error: true
      - name: "The packages of the tool that keeps the report (commons docs)"
        id: the-packages-of-the-tool-that-keeps-the--5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-packages-of-the-tool-that-keeps-the--5 --job "tests" --module "${{ matrix.name }}" --tool install --timeout 7 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: "The tests, kept as a CTRF report"
        id: tests
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id tests --job "tests" --module "${{ matrix.name }}" --tool bun-test --timeout 20 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "bun commons/docs/tools/evidence.ts --library \"${{ matrix.name }}\" --coverage --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "Why there is a report, or none"
        id: why-there-is-a-report-or-none-7
        if: "always()"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id why-there-is-a-report-or-none-7 --job "tests" --module "${{ matrix.name }}" --tool exit-status --timeout 20 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            mkdir -p "$RUNNER_TEMP/evidence"
            printf '{ "library": "%s", "install": "%s", "runner": "%s", "tests": "%s", "reported": %s }\n' "${{ matrix.name }}" "${{ steps.install.outputs.outcome }}" "${{ steps.runner.outputs.outcome }}" "${{ steps.tests.outputs.outcome }}" "$(test -f "$RUNNER_TEMP/evidence/${{ matrix.name }}.ctrf.json" && echo true || echo false)" > "$RUNNER_TEMP/evidence/status-${{ matrix.name }}.json"
        continue-on-error: true
      - name: "The report and its status, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-evidence-tests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the tests of the repository's own files (`tests/`)
  repository:
    name: "tests (repository)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The root's development tools, from bun.lock"
        id: install
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id install --job "repository" --module "repository" --tool install --timeout 7 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: .
        continue-on-error: true
      - name: "The documentation generator's dependencies, which the tests of the root import"
        id: the-documentation-generator-s-dependenci-4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-documentation-generator-s-dependenci-4 --job "repository" --module "repository" --tool install --timeout 7 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: "The test runner's own packages (commons quality)"
        id: runner
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id runner --job "repository" --module "repository" --tool install --timeout 7 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/quality
        continue-on-error: true
      - name: "The libraries, linked by name"
        id: the-libraries-linked-by-name-6
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-libraries-linked-by-name-6 --job "repository" --module "repository" --tool exit-status --timeout 20 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun commons/libraries/src/link.ts
        continue-on-error: true
      - name: "The tests, kept as a CTRF report"
        id: tests
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id tests --job "repository" --module "repository" --tool bun-test --timeout 20 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "bun commons/docs/tools/evidence.ts --library repository --coverage --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "Why there is a report, or none"
        id: why-there-is-a-report-or-none-8
        if: "always()"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id why-there-is-a-report-or-none-8 --job "repository" --module "repository" --tool exit-status --timeout 20 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            mkdir -p "$RUNNER_TEMP/evidence"
            printf '{ "library": "repository", "install": "%s", "runner": "%s", "tests": "%s", "reported": %s }\n' "${{ steps.install.outputs.outcome }}" "${{ steps.runner.outputs.outcome }}" "${{ steps.tests.outputs.outcome }}" "$(test -f "$RUNNER_TEMP/evidence/repository.ctrf.json" && echo true || echo false)" > "$RUNNER_TEMP/evidence/status-repository.json"
        continue-on-error: true
      - name: "The report and its status, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-repository
          path: ${{ runner.temp }}/evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-evidence-repository-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the mutation score of a small library, by the night and by hand: the suite is run once for each change made to the library's code, so it is slow; where it cannot be done the score of the night before stays
  mutation:
    name: mutation (${{ matrix.library }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: "github.event_name == 'workflow_dispatch' || github.event.schedule == '43 3 * * *'"
    strategy:
      fail-fast: false
      matrix:
        library: [archon-dialect-apt, archon-dialect-homebrew, archon-dialect-mise, archon-dialect-winget, integrations-github, catalog-nist-csf-2, archon-dns, catalog-nist-sp800, archon-converge, integrations-x12, lab]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock (the libraries it imports are linked)"
        id: the-development-tools-from-bun-lock-the--3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-development-tools-from-bun-lock-the--3 --job "mutation" --module "${{ matrix.library }}" --tool install --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: ${{ format('commons/{0}', matrix.library) }}
        continue-on-error: true
      - name: "The packages of the tool that keeps the report (commons docs)"
        id: the-packages-of-the-tool-that-keeps-the--4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-packages-of-the-tool-that-keeps-the--4 --job "mutation" --module "${{ matrix.library }}" --tool install --timeout 12 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: "The mutation run, kept as a small report"
        id: the-mutation-run-kept-as-a-small-report-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-mutation-run-kept-as-a-small-report-5 --job "mutation" --module "${{ matrix.library }}" --tool bun-test --timeout 32 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: "bun commons/docs/tools/mutation.ts --library \"${{ matrix.library }}\" --out \"$RUNNER_TEMP/evidence\""
        continue-on-error: true
      - name: "The score, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: evidence-mutation-${{ matrix.library }}
          path: ${{ runner.temp }}/evidence/*.mutation.json
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-evidence-mutation-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # every report in one artifact, whatever happened to the jobs that made them, with the run added to the history that the artifact of the run before carried
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [tests, repository, mutation]
    if: "always()"
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The packages of the tool that keeps the history (commons docs)"
        id: the-packages-of-the-tool-that-keeps-the--3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-packages-of-the-tool-that-keeps-the--3 --job "collect" --module "repository" --tool install --timeout 3 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/docs
        continue-on-error: true
      - name: The reports of the tests
        uses: actions/download-artifact@v4
        with:
          pattern: "evidence-*"
          path: _evidence
          merge-multiple: true
        continue-on-error: true
      - name: Which run this is
        id: which-run-this-is-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id which-run-this-is-5 --job "collect" --module "repository" --tool exit-status --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            mkdir -p _evidence
            printf '{ "commit": "%s", "at": "%s", "url": "%s" }\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > _evidence/meta.json
            ls -l _evidence | sed -n '1,200p'
        continue-on-error: true
      - name: "The run, added to the history"
        id: the-run-added-to-the-history-6
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-run-added-to-the-history-6 --job "collect" --module "repository" --tool exit-status --timeout 5 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          GH_TOKEN: ${{ github.token }}
          IFC_STEP_SCRIPT: |
            # the history travels from one run's artifact to the next: this run adds itself to the one the run before kept (it is cut to the newest 120)
            mkdir -p _history _prev
            gh run download --name evidence --dir _prev || echo 'no earlier evidence: the history begins here'
            if [ -d _prev/history ]; then cp -r _prev/history/. _history/; fi
            # the mutation scores are made by the night; the hours between keep the ones the run before had
            for f in _prev/*.mutation.json; do if [ -e "$f" ] && [ ! -e "_evidence/$(basename "$f")" ]; then cp "$f" _evidence/; fi; done
            bun commons/docs/tools/history.ts --evidence _evidence --history _history || echo 'the history could not be kept'
            mkdir -p _evidence/history && cp -r _history/runs _evidence/history/ 2>/dev/null || true
        continue-on-error: true
      - name: "The evidence, kept for the site"
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: _evidence
          retention-days: 7
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-evidence-collect-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this workflow, gathered: it passes if and only if the pipeline is sound (0038-build-policy FR-005); a failing test, a type error or a crashed command in any cell is a finding here and never a red job
  findings:
    name: findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan, tests, repository, mutation, collect]
    if: "always()"
    permissions:
      contents: write
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/bun
      - name: The findings every job kept
        uses: actions/download-artifact@v4
        with:
          pattern: "findings-evidence-*"
          path: _findings
          merge-multiple: true
        continue-on-error: true
      - name: "The findings, merged; the pipeline is sound where every cell that ran left its file (ci/collect.ts)"
        shell: bash
        run: |
          set -u
          if [ "$PLAN_RESULT" != "success" ]; then echo "the plan could not be made (the red cause plan-unavailable)"; exit 2; fi
          n_tests=$(jq '[.[].name] | unique | length' <<<"${PLAN_LINUX:-[]}")
          H=""
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            H="--history https://github.com/$GITHUB_REPOSITORY.git"
          fi
          bun commons/libraries/src/ci/collect.ts --dir _findings --out _findings-out --workflow evidence --expect "tests:$n_tests" --expect repository:1 --check-run $H
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: evidence
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_LINUX: ${{ needs.plan.outputs.linux }}
      - name: "The merged findings, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-evidence
          path: _findings-out
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true
