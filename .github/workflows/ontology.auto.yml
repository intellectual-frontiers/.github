# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: ontology

# Ontology, the ontologies of commons as typed values (Mizan, IFCCM, IFQS, IFR, the audit of packaging and the software supply chain), a library lifted out of `commons/ts` (commons 0032-lifting-libraries): its own `verify` (the compiler, the spec checker, the trace, its tests and the packing of its package with the inspection of its declarations) on Bun and its tests on
# Node 26, on Windows, macOS and Linux, because the package runs on all three.
on:
  push:
    paths:
      - ".github/actions/**"
      - .github/workflows/ontology.auto.yml
      - "commons/core/src/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/ontology/**"
      - "commons/rdf/src/**"
      - "commons/system/src/**"
      - "commons/test/src/**"
      - "commons/tools/**"
      - "commons/ts/kernel/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - .github/workflows/ontology.auto.yml
      - "commons/core/src/**"
      - "commons/libraries/src/**"
      - "commons/mizan/src/**"
      - "commons/ontology/**"
      - "commons/rdf/src/**"
      - "commons/system/src/**"
      - "commons/test/src/**"
      - "commons/tools/**"
      - "commons/ts/kernel/**"

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "The development tools, from bun.lock (the kernel is linked from commons/ts)"
        run: bun install --frozen-lockfile
        working-directory: commons/ontology
      - name: verify
        run: bun run verify
        working-directory: commons/ontology

  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "The development tools, from bun.lock"
        run: bun install --frozen-lockfile
        working-directory: commons/ontology
      - name: The tests on Node 26
        run: "node --test \"suite/**/*.test.ts\""
        working-directory: commons/ontology
