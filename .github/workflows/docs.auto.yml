# Generated by bun commons/ts/tools/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: docs

# The documentation site of commons (commons 0011-documentation FR-020): made by commons/docs, from commons' TypeScript and spec kit alone,
# as commons' configuration (commons/docs.config.ts) says. Every pull request and push that touches commons tests the generator and checks
# the site (no finding, every link and anchor resolves); a push to main builds the site and publishes it to GitHub Pages with GitHub's own
# actions. The site is never committed.
on:
  push:
    paths:
      - "commons/**"
      - package.json
      - .github/workflows/docs.auto.yml
      - ".github/actions/bun/**"
  pull_request:
    paths:
      - "commons/**"
      - package.json
      - .github/workflows/docs.auto.yml
      - ".github/actions/bun/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun
      - name: "TypeScript 7.1 (beta), Mermaid and @types/node, exactly as bun.lock pins them (IFC TypeScript is ../ts, by relative path)"
        run: bun install --frozen-lockfile
        working-directory: commons/docs
      - name: "The compiler, the generator's tests, then check on commons"
        run: bun run verify
        working-directory: commons/docs
      - name: "The site, built"
        if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
        run: "bun main.ts build --out \"$GITHUB_WORKSPACE/_site\""
        working-directory: commons/docs
      - name: "The site, kept for Pages"
        if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [check]
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Published to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
