name = "spec"
help = "Specs, requirements, the enforcement register, and the ontology's terms"

[nouns.spec]
help = "A spec: a numbered spec or a design system's spec (0020-spec-format)"
[nouns.requirement]
help = "One FR of a spec, and how it is enforced (0020-spec-format FR-011)"
[nouns.design-system]
help = "A design system: its spec, its entry in the ontology and its harness (0014-design-systems)"
[nouns.term]
help = "A concept or scheme of the ontology (0019-controlled-vocabulary)"

[sections.specs]
help = "Spec format: sections, status, identity, numbering, dated provenance, cross-references (0020 FR-005 to FR-009, FR-018; 0001 FR-034)"
watch = ["spec-kit/specs/**", "design-systems/*/spec.md", "ontology/ifcore.ttl"]
scope = "SPEC"
relocatable = true

[sections.register]
help = "The enforcement register: one row per requirement, mechanism, command (0020 FR-011 to FR-014)"
watch = ["spec-kit/enforcement.tsv", "spec-kit/specs/**", "design-systems/*/spec.md", ".devcontainer/ws-repos.json", "tools/agora/**"]
scope = "SPEC"
relocatable = true

[sections.controls]
help = "The control map: each row names a requirement and a control (0028 FR-005, FR-006)"
watch = ["spec-kit/controls.tsv", "spec-kit/specs/**", "design-systems/*/spec.md", "ontology/ifcore.ttl"]
relocatable = true

[sections.ontology]
help = "Ontology prefixes, and the design systems' registration, classification and derivation (0001 FR-007; 0014 FR-003, FR-010, FR-020)"
watch = ["ontology/**", "design-systems/**"]
relocatable = true

