name = "spec"
help = "Specs, requirements, the enforcement register, and the ontology"

[nouns.spec]
help = "A spec: a numbered spec or a design system's spec (0020-spec-format)"
icon = "file-text"
view = "specs"
title = "Spec"

[nouns.spec.list]
command = "spec list"
rows = "specs"
id = "name"
label = "name"
description = "title"
status = "status"
badge = "requirements"
tooltip = ["kind", "path"]

[nouns.spec.list.status_map]
Draft = "pending"
Adopted = "ok"
Superseded = "muted"
[nouns.requirement]
help = "One FR of a spec, and how it is enforced (0020-spec-format FR-011)"
icon = "checklist"
view = "specs"
title = "Requirement"

[nouns.requirement.list]
command = "requirement list"
rows = "requirements"
id = "requirement"
label = "requirement"
description = "mechanism"
status = "mechanism"
tooltip = ["text", "by", "note"]

[nouns.requirement.list.status_map]
check = "ok"
gate = "ok"
review = "info"
none = "warning"
[nouns.design-system]
help = "A design system: its spec, its entry in the ontology and its harness (0014-design-systems)"
icon = "symbol-color"
view = "design-systems"
title = "Design system"

[nouns.design-system.list]
command = "design-system list"
rows = "design systems"
id = "slug"
label = "slug"
description = "kind"
status = "status"
badge = "requirements"
tooltip = ["spec", "harness"]

[nouns.design-system.list.status_map]
Draft = "pending"
Adopted = "ok"
Active = "ok"
Superseded = "muted"
[nouns.ontology]
help = "A term of the ontology: a class, property, individual, concept scheme or concept (0042-agora FR-037)"
icon = "type-hierarchy"
view = "ontology"
title = "Ontology"

[nouns.ontology.list]
command = "ontology list"
rows = "terms"
id = "curie"
label = "label"
description = "curie"
icon = "icon"
search = "match"
tooltip = ["kind", "summary", "scheme", "notation"]

[nouns.reflection]
help = "A digital reflection, of one of its three kinds, and the subject it is a record of (0047-digital-reflections, 0048-noemas)"
icon = "lightbulb"
view = "ontology"
title = "Reflection"

[nouns.reflection.list]
command = "reflection list"
rows = "reflections"
id = "subject"
label = "label"
description = "kind"
status = "review"
tooltip = ["state", "record"]

[nouns.reflection.list.status_map]
candidate = "pending"
reviewed = "info"
accepted = "ok"
rejected = "muted"

[sections.specs]
help = "Spec format: sections, status, identity, numbering, dated provenance, cross-references (0020 FR-005 to FR-009, FR-018; 0001 FR-034)"
watch = ["spec-kit/specs/**", "design-systems/*/spec.md", "ontology/ifcore.ttl"]
scope = "SPEC"
relocatable = true

[sections.register]
help = "The enforcement register: one row per requirement, mechanism, command (0020 FR-011 to FR-014)"
watch = ["spec-kit/enforcement.tsv", "spec-kit/specs/**", "design-systems/*/spec.md", ".devcontainer/ws-repos.json", "tools/agora/**"]
scope = "SPEC"
relocatable = true

[sections.controls]
help = "The control map: each row names a requirement and a control (0028 FR-005, FR-006)"
watch = ["spec-kit/controls.tsv", "spec-kit/specs/**", "design-systems/*/spec.md", "ontology/ifcore.ttl"]
relocatable = true

[sections.ontology]
help = "Ontology prefixes, and the design systems' registration, classification and derivation (0001 FR-007; 0014 FR-003, FR-010, FR-020)"
watch = ["ontology/**", "design-systems/**"]
relocatable = true

# How each command is titled in the editor's command palette, and its icon where it has one (0041-command-line FR-064, FR-072).
[commands."design-system list"]
title = "List Design Systems"
[commands."design-system new"]
title = "New Design System…"
[commands."design-system show"]
title = "Show Design System…"
[commands."requirement add"]
title = "Add Control…"
[commands."requirement list"]
title = "List Requirements"
[commands."requirement set"]
title = "Set Enforcement…"
[commands."requirement show"]
title = "Show Requirement…"
[commands."spec list"]
title = "List Specs"
[commands."spec new"]
title = "New Spec…"
[commands."spec set"]
title = "Set Spec Status…"
icon = "verified"
[commands."spec show"]
title = "Show Spec…"
[commands."ontology list"]
title = "List Ontology Terms"
[commands."ontology show"]
title = "Show Ontology Term…"
[commands."reflection list"]
title = "List Reflections"
[commands."reflection show"]
title = "Show Reflection…"

# A requirement named in a spec or a register (`0020 FR-013`) is a resource an editor can show on hover and open (0041-command-line FR-064).
[references.requirement]
noun = "requirement"
pattern = '\b(\d{4})(?:-[a-z0-9-]+)?[ /](FR-\d{3})\b'
value = "$1/$2"
files = ["spec-kit/specs/**/*.md", "spec-kit/enforcement.tsv", "spec-kit/controls.tsv"]
text = "text"
facts = ["mechanism", "by", "note"]
lens = ["mechanism", "by"]
definition = ["path", "line"]
