name = "assurance"
help = "The design systems' assurance harnesses, each brand's imagery pool and share card, its Open edX package, and the profile's figure"

# Python packages the harnesses and the brand tools import (0041-command-line FR-003; 0042-agora FR-018), each to one
# exact version, locked with hashes in agora.lock. Found by reading every harness and the scripts it imports:
#   Pillow                 frontiers-figures (svgkit.py), frontiers-media (media.py), frontiers-signage-print (signage.py)
#                          measure text with ImageFont; the imagery checks and the Open edX favicon read and write images
#                          (in place of ImageMagick); the profile's figure generator draws with frontiers-figures
#   fontTools              frontiers-figures (theme.py) and frontiers-course (build.py) cut and embed the brand's sans as WOFF;
#                          frontiers-signage-print cuts the sans it embeds in a PDF
#   lxml                   frontiers-course's harness validates cmi5.xml against cmi5's schema
#   pypdf, pypdfium2       frontiers-print and frontiers-signage-print read the PDFs they build: page size, fonts, images
#                          (pypdf, BSD-3-Clause) and the text layer (pypdfium2, Apache-2.0 or BSD-3-Clause), in place of
#                          poppler's pdfinfo, pdffonts, pdfimages and pdftotext
#   reportlab              frontiers-signage-print writes the sign's vector PDF (BSD-3-Clause), in place of rsvg-convert
#   resvg-py               frontiers-figures and frontiers-media render SVG with the design systems' own fonts alone, in
#                          place of rsvg-convert
#   nodejs-wheel-binaries  the Node the browser harnesses, the course's script tests and Paragon's CLI run on (lib/node.py)
[packages]
Pillow = "12.3.0"
fonttools = "4.66.1"
lxml = "6.1.3"
nodejs-wheel-binaries = "22.20.0"
pypdf = "6.19.0"
pypdfium2 = "5.14.0"
reportlab = "5.0.1"
resvg-py = "0.5.0"

# Programs outside Python are toolchain entries (0041-command-line FR-006, FR-066; 0042-agora FR-030), declared in code under
# tools/agora/toolchain/ and fetched into the per-user cache on first use. What each kind of harness needs of them: an entry
# that cannot be had (offline with a cold cache, no build for the platform, a browser's system libraries missing) skips the
# harness, naming the entry and the command that fixes it, and makes the run exit 3 (0041-command-line FR-033); nothing is
# reported as passed that did not run.
[runners.browser]
toolchain = ["chromium", "npm-packages"]
[runners.python]
toolchain = []

# What one harness needs beyond its kind.
[harnesses."frontiers-print:python"]
toolchain = ["tinytex", "tex-packages"]

[sections.design-systems]
help = "Each design system's assurance harness: browser harnesses under every brand, Python harnesses once; fails where a design system has none (0014 FR-015, FR-017, FR-039)"
watch = ["design-systems/**", "tools/agora/lib/assurance.py", "tools/agora/groups/assurance/**"]
scope = "DESIGN_SYSTEM"
options = ["--runner", "--brand"]

[sections.imagery]
help = "Each brand's imagery pool and share card: catalog, masters, WebP files, app icons (0014 FR-037, FR-043)"
watch = ["design-systems/*/imagery/**", "design-systems/*/images/**", "design-systems/*/tokens.json", "tools/agora/lib/imagery.py"]
scope = "BRAND"

[sections.openedx]
help = "A brand's Open edX package is what is written from its tokens, and, with Paragon, what it builds, every pair 4.5:1 (frontiers-brand FR-020)"
watch = ["design-systems/*/openedx/**", "design-systems/*/tokens.json", "design-systems/*/assurance/run.py", "tools/agora/lib/openedx.py"]
scope = "BRAND"
options = ["--paragon"]
toolchain = ["npm-packages"]
toolchain_unless = "paragon"  # Paragon's CLI, from the npm lock, unless --paragon names one of the person's own

[nouns.figure]
help = "A figure drawn with frontiers-figures and themed by a brand (0014-design-systems FR-044)"

[generators.profile-figure]
help = "The organization profile's figure: its semantic source and the themed default and on-dark images"
sources = ["design-systems/frontiers-figures/**", "design-systems/frontiers-brand/tokens.json", "design-systems/frontiers-brand/fonts/**", "tools/agora/lib/profile_figure.py"]
outputs = ["profile/figures/*.svg"]
command = "figure generate"
