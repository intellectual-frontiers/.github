name = "toolchain"
help = "The one check of the programs outside Python that commands need: what `.workspaces-host/` declares and ws-host installs, and that each works (0041-command-line FR-066, FR-068; 0042-agora FR-030)"

[sections.toolchain]
help = "agora's toolchain declarations are valid, complete and current with their generated mise files, no workflow installs a program, and no command takes a program from the host (0041-command-line FR-068; 0025-tooling-environment FR-016, FR-020, FR-022); --functional also runs each installed entry's own check"
watch = [".workspaces-host/**", "tools/agora/toolchain/**", "tools/agora/core/toolchain.py", "tools/agora/groups/*/agora.lock", "tools/agora/groups/*/agora.toml", ".github/workflows/**", "tools/agora/**/*.py"]
options = ["--functional"]
