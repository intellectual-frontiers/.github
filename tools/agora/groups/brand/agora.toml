name = "brand"
help = "A brand's theme and specimen, imagery pool, ink verification and Open edX package"

# Python packages the brand tools import (0041-command-line FR-003; 0042-agora FR-018), each to one exact version, locked with
# hashes in agora.lock. Found by reading the libraries:
#   Pillow                 `imagery` reads the masters and writes the WebP, PNG and ICO files; `openedx generate` writes the
#                          favicon of a brand that has none (0042-agora FR-030: Pillow in place of ImageMagick)
[packages]
Pillow = "12.3.0"

[nouns.brand]
help = "A brand design system: tokens.json and what is written from it (0014-design-systems FR-028)"
icon = "paintcan"
view = "design-systems"
title = "Brand"

[nouns.brand.list]
command = "brand list"
rows = "brands"
id = "name"
label = "name"
description = "inks"
badge = "pieces"
tooltip = ["palette", "roles", "lockups"]
[nouns.imagery]
help = "A brand's imagery pool: its catalog, masters, WebP files and share card (0014-design-systems FR-043)"
icon = "file-media"
view = "design-systems"
title = "Imagery"
[nouns.ink]
help = "An ink of a brand's decoration kit: its spot color and thread, and who verified them (frontiers-brand FR-017)"
icon = "edit"
view = "design-systems"
title = "Ink"
[nouns.openedx]
help = "A brand's Open edX brand package (frontiers-brand FR-020)"
icon = "mortar-board"
view = "design-systems"
title = "Open edX package"

# Generators (0041-command-line FR-035; 0042-agora FR-015): what each reads and writes, and the command that rewrites it.
# `agora fresh` proves each current.
[generators.brand-theme]
help = "A brand's brand.css and brand.tex, from its tokens.json"
sources = ["design-systems/*/tokens.json"]
outputs = ["design-systems/*/brand.css", "design-systems/*/brand.tex"]
command = "brand generate"

[generators.brand-specimen]
help = "A brand's assurance specimen, from its tokens.json"
sources = ["design-systems/*/tokens.json"]
outputs = ["design-systems/*/assurance/fixtures/specimen.html"]
command = "brand generate"

[generators.brand-imagery]
help = "A brand's WebP files, share card, app icons and favicon, from its masters and tokens"
sources = ["design-systems/*/imagery/*.png", "design-systems/*/imagery/catalog.json", "design-systems/*/logos/*.png", "design-systems/*/images/favicon.png", "design-systems/*/tokens.json", "tools/agora/lib/imagery.py"]
outputs = ["design-systems/*/imagery/web/**", "design-systems/*/images/share-card.png", "design-systems/*/images/favicon.ico", "design-systems/*/images/icons/**"]
command = "imagery build"

[generators.openedx-sources]
help = "A brand's Open edX package sources (everything but the built dist/), from its tokens.json, logos and fonts"
sources = ["design-systems/*/tokens.json", "design-systems/*/logos/**", "design-systems/*/images/**", "design-systems/frontiers-course/web/fonts/**"]
outputs = ["design-systems/*/openedx/**"]
command = "openedx generate"

# How each command is titled in the editor's command palette, and its icon where it has one (0041-command-line FR-064, FR-072).
[commands."brand generate"]
title = "Generate Brand Files"
[commands."brand list"]
title = "List Brands"
[commands."brand show"]
title = "Show Brand…"
[commands."imagery add"]
title = "Add Imagery…"
[commands."imagery build"]
title = "Build Imagery…"
[commands."imagery list"]
title = "List Imagery…"
[commands."imagery show"]
title = "Show Imagery…"
[commands."ink list"]
title = "List Inks…"
[commands."ink record"]
title = "Record Ink…"
icon = "verified"
[commands."ink show"]
title = "Show Ink…"
[commands."openedx build"]
title = "Build Open edX Package…"
[commands."openedx generate"]
title = "Generate Open edX Sources…"
