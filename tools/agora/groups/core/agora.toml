name = "core"
help = "The repository-wide commands (0041-command-line FR-010) and the registry's own"

[nouns.command]
help = "A command of this command line"
icon = "terminal"
title = "Command"

[sections.commands]
help = "The registry and the ontology list the same commands, with the same noun, verb and category (0042-agora FR-004)"
watch = ["agora", "tools/agora/**", "ontology/ifcore.ttl", ".github/workflows/**", ".agora/proposals/**", "README.md", ".gitignore"]

[nouns.mcp]
help = "The MCP server of this command line, for AI agents, over standard input and output (0041-command-line FR-027)"
icon = "plug"
title = "MCP server"

# How each command is titled in the editor's command palette, and its icon where it has one (0041-command-line FR-064, FR-072).
[commands."check"]
title = "Run Checks"
icon = "checklist"
[commands."command list"]
title = "List Commands"
[commands."command show"]
title = "Show Command…"
[commands."context"]
title = "Show Context…"
icon = "sparkle"
[commands."doctor"]
title = "Run Doctor"
icon = "pulse"
[commands."fresh"]
title = "Check Freshness"
icon = "sync"
[commands."test"]
title = "Run Tests"
icon = "beaker"
