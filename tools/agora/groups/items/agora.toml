name = "items"
help = "What the item design systems' scripts build, and the checks of their work: decks, emails, courses, media, signs, figures, voice, merchandise"

# Python packages the item scripts import (0041-command-line FR-003; 0042-agora FR-018), each to one exact version, locked
# with hashes in agora.lock. Found by reading the scripts:
#   Pillow     frontiers-figures (svgkit.py), frontiers-media and frontiers-signage-print measure text with ImageFont
#   fontTools  frontiers-figures (theme.py) and frontiers-course (build.py) cut the brand's sans for --embed-fonts and the
#              web edition; frontiers-signage-print cuts the sans it embeds in a PDF
#   resvg-py   frontiers-media renders its SVG to PNG with fonts/ alone, in place of rsvg-convert (0042-agora FR-030)
#   reportlab  frontiers-signage-print writes the sign's vector PDF, in place of rsvg-convert
# The voice, slides, email, course and merchandise scripts need only the standard library, and run here beside them.
[packages]
Pillow = "12.3.0"
fonttools = "4.66.1"
reportlab = "5.0.1"
resvg-py = "0.5.0"

[nouns.deck]
help = "A slide deck written in Markdown and built by frontiers-slides (0014-design-systems FR-040)"
icon = "preview"
view = "builds"
title = "Deck"
[nouns.email]
help = "An email written in Markdown and built by frontiers-email (0014-design-systems FR-040)"
icon = "mail"
view = "builds"
title = "Email"
[nouns.course]
help = "A course written in AsciiDoc, read and built by frontiers-course (0014-design-systems FR-040)"
icon = "book"
view = "builds"
title = "Course"
[nouns.media]
help = "A media asset, a job rendered by frontiers-media (0014-design-systems FR-040)"
icon = "device-camera-video"
view = "builds"
title = "Media"
[nouns.sign]
help = "A printed sign, a job rendered by frontiers-signage-print (0014-design-systems FR-040)"
icon = "megaphone"
view = "builds"
title = "Sign"

# The item checks take `--scope PATH` (more than once) to the work they check. With none, each checks the passing fixtures
# of the design system whose script it runs (0042-agora FR-013). Each runs in its own process under this group's lock, so
# that a plain `check` (which runs every section) never holds this group's lock and the assurance group's in one.
[sections.figures]
help = "Figure sources against frontiers-figures' mechanical rules: canvas, role colors, label size, labels inside their boxes (figcheck.py)"
watch = ["design-systems/frontiers-figures/**", "design-systems/frontiers-slides/assurance/fixtures/pass/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--brand"]

[sections.voice]
help = "Prose against frontiers-written-voice's sweep, or with --spoken a script against frontiers-spoken-voice's too (sweep.py)"
watch = ["design-systems/frontiers-written-voice/**", "design-systems/frontiers-spoken-voice/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--mode", "--draft", "--spoken"]

[sections.slides]
help = "Decks against frontiers-slides' rules: layouts, headlines, points, notes, figures, voice (deck.py check)"
watch = ["design-systems/frontiers-slides/**", "design-systems/frontiers-figures/**", "design-systems/frontiers-written-voice/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--brand"]

[sections.email]
help = "Messages against frontiers-email's rules: subject, preheader, one button, https links, address, voice (mail.py check)"
watch = ["design-systems/frontiers-email/**", "design-systems/frontiers-written-voice/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--brand"]

[sections.course]
help = "Courses against frontiers-course's rules: outcomes taught and assessed, accessibility, limits, voice (course.py check)"
watch = ["design-systems/frontiers-course/**", "design-systems/frontiers-figures/**", "design-systems/frontiers-written-voice/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true

[sections.media]
help = "Media jobs against frontiers-media's rules: format, safe margin, title fit, lockup, voice (media.py check)"
watch = ["design-systems/frontiers-media/**", "design-systems/frontiers-written-voice/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--brand"]

[sections.signage]
help = "Sign jobs against frontiers-signage-print's rules: format, details, imagery resolution, voice (signage.py check)"
watch = ["design-systems/frontiers-signage-print/**", "design-systems/frontiers-written-voice/**", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--brand"]

[sections.merchandise]
help = "Decoration jobs against frontiers-merchandise's rules and a brand's decoration kit (decoration.py)"
watch = ["design-systems/frontiers-merchandise/**", "design-systems/*/tokens.json", "tools/agora/lib/items.py", "tools/agora/groups/items/**"]
scope = "PATH"
scope_many = true
isolated = true
options = ["--brand"]

# How each command is titled in the editor's command palette, and its icon where it has one (0041-command-line FR-064, FR-072).
[commands."course build"]
title = "Build Course…"
[commands."course show"]
title = "Show Course…"
[commands."deck build"]
title = "Build Deck…"
[commands."email build"]
title = "Build Email…"
[commands."figure build"]
title = "Build Figure…"
[commands."media build"]
title = "Build Media…"
[commands."sign build"]
title = "Build Sign…"
