name = "selftest"
help = "The packages agora's own tests import, to run the libraries against this repository's design systems; no command of its own"

# Every package a group below pins, at the version that group pins (a test proves the two agree), because a test runs a
# library in its own process without re-running it under the group's lock (0041-command-line FR-028).
[packages]
Pillow = "12.3.0"
dulwich = "1.2.17"
fonttools = "4.66.1"
lxml = "6.1.3"
potracer = "0.0.4"
pypdf = "6.19.0"
pypdfium2 = "5.14.0"
reportlab = "5.0.1"
resvg-py = "0.5.0"
uharfbuzz = "0.56.2"
