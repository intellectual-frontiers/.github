# Generated by bun commons/libraries/src/generate-workflows.ts; do not edit (commons 0030-generated-workflows).
name: conformance

# What a library's own tests cannot run alone: the OTLP of the telemetry library sent to the pinned OpenTelemetry Collector and read back from its file exporter (telemetry 0001-telemetry FR-020),
# and a program built into one binary by the pinned Bun on each system, then run, and Windows built from Linux (system 0001-system FR-013). Nothing is released.
on:
  push:
    paths:
      - "commons/telemetry/**"
      - "commons/system/**"
      - commons/generated/pins.auto.env
      - ".github/actions/bun/**"
      - .github/workflows/conformance.auto.yml
  pull_request:
    paths:
      - "commons/telemetry/**"
      - "commons/system/**"
      - commons/generated/pins.auto.env
      - ".github/actions/bun/**"
      - .github/workflows/conformance.auto.yml

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # whether this commit was proved already by a run of this workflow (0030-generated-workflows FR-015): only a push to a branch other than main can be, and the answer is not proved where GitHub cannot be asked
  seen:
    name: seen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proved: ${{ steps.seen.outputs.proved }}
    steps:
      - name: Whether this commit has a run of this workflow that succeeded
        id: seen
        shell: bash
        run: |
          proved=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) || n=0
            case "$n" in ""|*[!0-9]*) n=0 ;; esac
            if [ "$n" -gt 0 ]; then proved=true; fi
          fi
          echo "proved=$proved" >> "$GITHUB_OUTPUT"
          echo "commit $GITHUB_SHA on $GITHUB_REF: proved before = $proved" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: conformance.auto.yml
        continue-on-error: true

  # commons 0006-signals FR-020: the suite's OTLP sent to the pinned OpenTelemetry Collector, read back from its file exporter.
  otel-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [seen]
    if: "needs.seen.outputs.proved != 'true'"
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock"
        id: the-development-tools-from-bun-lock-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-development-tools-from-bun-lock-3 --job "otel-conformance" --module "repository" --tool install --timeout 3 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/telemetry
        continue-on-error: true
      - name: "The OpenTelemetry Collector, verified against commons' pins"
        id: the-opentelemetry-collector-verified-aga-4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-opentelemetry-collector-verified-aga-4 --job "otel-conformance" --module "repository" --tool exit-status --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            url=$(sed -n 's/^OTELCOL_CONTRIB_URL_X86_64=//p' commons/generated/pins.auto.env)
            sum=$(sed -n 's/^OTELCOL_CONTRIB_SHA256_X86_64=//p' commons/generated/pins.auto.env)
            dir="$RUNNER_TEMP/otelcol"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/otelcol.tar.gz" "$url"
            echo "$sum  $dir/otelcol.tar.gz" | sha256sum -c -
            tar -xzf "$dir/otelcol.tar.gz" -C "$dir" otelcol-contrib
            echo "IFC_OTELCOL=$dir/otelcol-contrib" >>"$GITHUB_ENV"
        continue-on-error: true
      - name: "The conformance test, on Bun and on Node"
        id: the-conformance-test-on-bun-and-on-node-5
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-conformance-test-on-bun-and-on-node-5 --job "otel-conformance" --module "repository" --tool bun-test --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            bun test suite/otel-conformance.test.ts
            node --test suite/otel-conformance.test.ts
        working-directory: commons/telemetry
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-conformance-otel-conformance-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # commons system 0001-system FR-013: a program built into one binary by the pinned Bun on each system, then run; and Windows built from Linux.
  compile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [seen]
    if: "needs.seen.outputs.proved != 'true'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        continue-on-error: true
      - name: "The development tools, from bun.lock"
        id: the-development-tools-from-bun-lock-3
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id the-development-tools-from-bun-lock-3 --job "compile" --module "system" --tool install --timeout 3 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun install --frozen-lockfile
        working-directory: commons/system
        continue-on-error: true
      - name: "Built for this computer, with an embedded file, and run"
        id: built-for-this-computer-with-an-embedded-4
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id built-for-this-computer-with-an-embedded-4 --job "compile" --module "system" --tool bun-test --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: bun test suite/compile.test.ts
        working-directory: commons/system
        continue-on-error: true
      - name: "Built for Windows from Linux, by the pinned Bun alone"
        id: built-for-windows-from-linux-by-the-pinn-5
        if: "runner.os == 'Linux'"
        shell: bash
        run: |
          bun "$GITHUB_WORKSPACE/commons/libraries/src/ci/step.ts" --id built-for-windows-from-linux-by-the-pinn-5 --job "compile" --module "system" --tool exit-status --timeout 8 --out "$RUNNER_TEMP/findings" -- bash -e -o pipefail -c "$IFC_STEP_SCRIPT"
        env:
          IFC_STEP_SCRIPT: |
            v=$(sed -n 's/^BUN_VERSION=//p' ../generated/pins.auto.env)
            mkdir -p "$RUNNER_TEMP/cross"
            printf 'console.log("ok");\n' >"$RUNNER_TEMP/cross/hello.ts"
            bun -e '
              import { compile, describeCompileError } from "./src/compile.ts";
              const r = await compile({ entry: process.argv[1], outfile: process.argv[2], target: "windows-x64", bunVersion: process.argv[3] });
              if (r.kind === "err") { console.error(describeCompileError(r.error)); process.exit(1); }
              console.log(r.value.path, r.value.sha256);
            ' "$RUNNER_TEMP/cross/hello.ts" "$RUNNER_TEMP/cross/hello" "$v"
            test -f "$RUNNER_TEMP/cross/hello.exe"
        working-directory: commons/system
        continue-on-error: true
      - name: "The findings of this job, kept for the job that gathers them"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-conformance-compile-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this workflow, gathered: it passes if and only if the pipeline is sound (0038-build-policy FR-005); a failing test, a type error or a crashed command in any cell is a finding here and never a red job
  findings:
    name: findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [seen, otel-conformance, compile]
    if: "always() && needs.seen.outputs.proved != 'true'"
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/bun
        with:
          tools: "false"
      - name: The findings every job kept
        uses: actions/download-artifact@v4
        with:
          pattern: "findings-conformance-*"
          path: _findings
          merge-multiple: true
        continue-on-error: true
      - name: "The findings, merged; the pipeline is sound where every cell that ran left its file (ci/collect.ts)"
        shell: bash
        run: |
          set -u
          empty='{}'
          bun commons/libraries/src/ci/collect.ts --dir _findings --out _findings-out --workflow conformance  --check-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: conformance
      - name: "The merged findings, kept for the site"
        if: "always()"
        uses: actions/upload-artifact@v4
        with:
          name: findings-conformance
          path: _findings-out
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

  # the findings of this run added to the history branch (0038-build-policy FR-012): main only, the one job with the permission to write the repository's contents, never a red run
  keep-findings:
    name: keep-findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [findings]
    if: "always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: ./.github/actions/bun
        with:
          tools: "false"
        continue-on-error: true
      - name: The merged findings of this workflow
        uses: actions/download-artifact@v4
        with:
          name: findings-conformance
          path: _findings-merged
        continue-on-error: true
      - name: "The findings added to the history branch (the only writer)"
        shell: bash
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bun commons/libraries/src/ci/history.ts --file _findings-merged/findings.json --remote "https://github.com/$GITHUB_REPOSITORY.git"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
