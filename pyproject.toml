# The one place agora's Python is written (0025-tooling-environment FR-013, FR-014; 0041-command-line FR-002, FR-003): the Python floor, and
# the packages each command group needs, as dependency groups (PEP 735) pinned to one exact version. `uv.lock` holds the resolution with a
# hash for every file; `agora lock` writes it and nothing else installs from anywhere else. A group that is not listed pins nothing and runs on
# the standard library alone. The project is not a package: it names this environment, so uv has something to lock.
[project]
name = "agora-env"
version = "0"
description = "The environment agora's commands run in; not a package"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.11"

# The revision of workspaces-host whose archon runs this repository's command line (0025-tooling-environment FR-014).
[tool.archon]
revision = "7939e6e"

[dependency-groups]
# Pillow       the imagery checks and the Open edX favicon read and write images (in place of ImageMagick); frontiers-figures (svgkit.py),
#              frontiers-media (media.py) and frontiers-signage-print (signage.py) measure text with ImageFont
# fonttools    frontiers-figures (theme.py) and frontiers-course (build.py) cut and embed the brand's sans as WOFF; frontiers-signage-print
#              cuts the sans it embeds in a PDF
# lxml         frontiers-course's harness validates cmi5.xml against cmi5's schema
# pypdf, pypdfium2  frontiers-print and frontiers-signage-print read the PDFs they build: page size, fonts, images (pypdf, BSD-3-Clause) and the
#              text layer (pypdfium2, Apache-2.0 or BSD-3-Clause), in place of poppler's pdfinfo, pdffonts, pdfimages and pdftotext
# reportlab    frontiers-signage-print writes the sign's vector PDF (BSD-3-Clause), in place of rsvg-convert
# resvg-py     frontiers-figures and frontiers-media render SVG with the design systems' own fonts alone, in place of rsvg-convert
assurance = [
    "Pillow==12.3.0",
    "fonttools==4.66.1",
    "lxml==6.1.3",
    "pypdf==6.19.0",
    "pypdfium2==5.14.0",
    "reportlab==5.0.1",
    "resvg-py==0.5.0",
]
# Pillow       `imagery` reads the masters and writes the WebP, PNG and ICO files; `openedx generate` writes the favicon of a brand that has none
brand = ["Pillow==12.3.0"]
# Pillow       reads the raster masters, composites them on white, takes their luminance and enlarges them (Lanczos)
# potracer     traces the enlarged master with potrace's algorithm (a pure-Python port, GPL-2.0-or-later; used here as a tool, never shipped;
#              it needs numpy, BSD-3-Clause)
# resvg-py     renders the artwork to measure its finest detail (MPL-2.0 resvg; the artwork has no text)
# uharfbuzz    shapes the wordmark's text with the font's own kerning and draws the glyph outlines
decoration = [
    "Pillow==12.3.0",
    "potracer==0.0.4",
    "resvg-py==0.5.0",
    "uharfbuzz==0.56.2",
]
items = [
    "Pillow==12.3.0",
    "fonttools==4.66.1",
    "reportlab==5.0.1",
    "resvg-py==0.5.0",
]
# dulwich      reads Git's state in place of a `git` program (0042-agora FR-030)
vcs = ["dulwich==1.2.17"]
# agora's own tests import every library the groups do, so they run under the union of the groups
selftest = [
    { include-group = "assurance" },
    { include-group = "brand" },
    { include-group = "decoration" },
    { include-group = "items" },
    { include-group = "vcs" },
]
