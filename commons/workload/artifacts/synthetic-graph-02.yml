name: synthetic-graph-02

on:
  workflow_dispatch:
    inputs:
      order:
        description: order
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  WORKLOAD_PLAN: "64770c615c88c26b19f6eb79c0981939ca3f7a67998081327e0139c0de4e2ab3"

concurrency:
  group: synthetic-graph-02
  cancel-in-progress: false

jobs:
  # step read-state: check, agent-autonomous
  read-state:
    name: Read the workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: read-state
        shell: bash
        run: "workload verb workbench.ready --in 'task=run'"

  # step record-order: verb, agent-acts-human-reviews
  record-order:
    name: Record the order
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [read-state]
    permissions:
      contents: read
    env:
      WORKLOAD_INPUT_ORDER: ${{ inputs.order }}
    steps:
      - uses: actions/checkout@v4
      - name: record-order
        shell: bash
        run: "workload verb work.record --in \"order=${WORKLOAD_INPUT_ORDER}\""
