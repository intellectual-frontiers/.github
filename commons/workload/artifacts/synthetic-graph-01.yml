# Generated by commons/workload from the plan of synthetic-graph-01 0.1.0 (the form graph); do not edit it: regenerate it.
# plan: 7cb11d2be54ae157e7a80a6d70a308f412234623da7e7da8be52a55095c97240
name: synthetic-graph-01

on:
  workflow_dispatch:
    inputs:
      order:
        description: order
        type: string
        default: ""
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

env:
  WORKLOAD_PLAN: "7cb11d2be54ae157e7a80a6d70a308f412234623da7e7da8be52a55095c97240"

concurrency:
  group: synthetic-graph-01
  cancel-in-progress: false

jobs:
  # step observe-state: check, agent-autonomous
  observe-state:
    name: Read the state of the live store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SYNTHETIC_TOKEN_01: ${{ secrets.SYNTHETIC_TOKEN_01 }}
    steps:
      - uses: actions/checkout@v4
      - name: observe-state
        shell: bash
        run: "workload verb state.observe --in 'store=synthetic-live-01'"

  # step record-state: verb, agent-acts-human-reviews
  record-state:
    name: Record the state as evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [observe-state]
    permissions:
      contents: read
    env:
      WORKLOAD_INPUT_ORDER: ${{ inputs.order }}
      SYNTHETIC_TOKEN_01: ${{ secrets.SYNTHETIC_TOKEN_01 }}
    steps:
      - uses: actions/checkout@v4
      - name: record-state
        shell: bash
        run: "workload verb work.record --in \"order=${WORKLOAD_INPUT_ORDER}\""

  # step record-hosts: each over hosts, agent-acts-human-reviews
  record-hosts:
    name: Record the order on each host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [observe-state]
    permissions:
      contents: read
    env:
      WORKLOAD_INPUT_ORDER: ${{ inputs.order }}
      SYNTHETIC_TOKEN_01: ${{ secrets.SYNTHETIC_TOKEN_01 }}
    strategy:
      fail-fast: false
      matrix:
        member: [synthetic-host-01, synthetic-host-02]
    steps:
      - uses: actions/checkout@v4
      - name: record-host
        shell: bash
        run: "workload verb work.record --in \"order=${WORKLOAD_INPUT_ORDER}\" --member \"$MEMBER\""
        env:
          MEMBER: ${{ matrix.member }}

  # step publish-result: verb, human-only
  publish-result:
    name: Publish the result to the store of results
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [record-state, record-hosts]
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: approve-publish
    env:
      WORKLOAD_INPUT_ORDER: ${{ inputs.order }}
      SYNTHETIC_TOKEN_01: ${{ secrets.SYNTHETIC_TOKEN_01 }}
    steps:
      - uses: actions/checkout@v4
      - name: publish-result
        shell: bash
        run: "workload verb external.apply --in \"key=${WORKLOAD_INPUT_ORDER}\" --in 'store=synthetic-result-01'"
