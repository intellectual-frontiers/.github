[[prohibitions]]
manager = "pacman"
argv = ["pacman", "-Sy"]
reason = "Refreshing the package list alone leaves a rolling release partly upgraded; upgrade with -Syu, or install with -S --needed and let a missing package say the list is old."

[[prohibitions]]
manager = "pacman"
argv = ["pacman", "-Sy", "{packages}"]
reason = "Installing from a freshly refreshed list without upgrading the rest of the system is a partial upgrade."

[[prohibitions]]
manager = "yay"
argv = ["yay", "-S", "{packages}"]
reason = "An AUR helper builds and runs scripts of packages nobody reviewed with the person's rights; a harness never drives one."

[[prohibitions]]
manager = "yay"
argv = ["yay", "-Sy"]
reason = "A refresh alone is a partial upgrade, and a harness never drives an AUR helper."

