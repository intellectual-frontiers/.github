# IFC TypeScript's tools, all from Bun (commons 0005-typescript-runtime FR-026 to FR-028).

[fmt]
printWidth = 140

[lint]
typeAware = true
# IFC TypeScript's own lint plugin (FR-061), with commons' own lists.
plugins = ["./lint/plugin.ts"]

[lint.rules]
# Algebraic type safety: no escape from the type system, every alternative handled, every promise awaited (FR-028).
"typescript/no-explicit-any" = "error"
"typescript/no-non-null-assertion" = "error"
"typescript/explicit-module-boundary-types" = "error"
"typescript/switch-exhaustiveness-check" = "error"
"typescript/no-floating-promises" = "error"
"typescript/no-misused-promises" = "error"
"typescript/consistent-type-imports" = "error"
"typescript/only-throw-error" = "error"
"typescript/no-unnecessary-type-assertion" = "error"
"typescript/ban-ts-comment" = ["error", { "ts-expect-error" = "allow-with-description", "minimumDescriptionLength" = 10 }]
"eslint/eqeqeq" = "error"
# The rules of the plugin (FR-061), as commons applies them to itself.
"ifc/no-vendor-api" = "error"
"ifc/no-registry-import" = "error"
"ifc/import-boundary" = ["error", { roots = ["kernel"] }]
"ifc/module-doc" = "error"
"ifc/switch-absurd" = "error"
"ifc/terminal-writers" = [
  "error",
  { allow = [
    { files = "runtime/console.ts", reason = "the renderer, the one writer for a person (0006-signals FR-026)" },
    { files = "../system/src/tty.ts", reason = "the terminal's own streams, for its size and raw mode" },
    { files = "../system/src/stdio.ts", reason = "the process's standard streams, for what programs read (FR-054)" },
    { files = "tools/**", reason = "command-line tools print their results" },
    { files = "quality/assessor/verify.ts", reason = "the verifier a pack carries imports nothing of commons (0022-trust FR-016) and prints its report itself" },
  ] },
]
