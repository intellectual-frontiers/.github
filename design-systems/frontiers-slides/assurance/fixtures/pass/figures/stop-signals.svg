<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 428" width="1040" height="428">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="428" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">Three signals end a pilot</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">Any one of them is enough</text>
  <rect x="140.0" y="120" width="760" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="162.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">The metric misses its threshold</text>
