  <rect x="140.0" y="224" width="760" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="266.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">The date passes with no signal</text>
  <line x1="520.0" y1="294" x2="520.0" y2="327" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="140.0" y="328" width="760" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="370.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">The team cannot name the next test</text>
